<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeProud — ประวัติออเดอร์</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#055367;--teal:#1F7A95;--teal2:#e6f4f8;--gold:#C2822B;
  --bg:#f0f2f5;--surface:#fff;--border:#e4e8ed;--border2:#d0d7e0;
  --text:#1a2030;--sub:#6b7585;--hint:#adb5c0;
  --y-bg:#fff8e6;--y-dot:#f59e0b;--y-text:#7c4a00;
  --b-bg:#e8f3ff;--b-dot:#3b82f6;--b-text:#1a4a80;
  --g-bg:#e8faf0;--g-dot:#22c55e;--g-text:#0d4f2a;
  --r-bg:#fff0f0;--r-dot:#ef4444;--r-text:#7a1a1a;
  --r:10px;--r-sm:6px;
  --sh:0 1px 4px rgba(0,0,0,.07);--t:.15s ease;
}
[data-dark]{
  --bg:#10131a;--surface:#181d27;--border:#262d3a;--border2:#323a47;
  --text:#e8ecf2;--sub:#8892a4;--hint:#444e60;--teal2:#0d2535;
  --y-bg:#261c04;--y-text:#fcd34d;
  --b-bg:#071830;--b-text:#93c5fd;
  --g-bg:#041a0e;--g-text:#86efac;
  --r-bg:#1a0404;--r-text:#fca5a5;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Sarabun',-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;font-size:14px;line-height:1.5;
  transition:background var(--t),color var(--t);
  -webkit-font-smoothing:antialiased;
}
a{text-decoration:none;color:inherit;}
button,select,input{font-family:inherit;font-size:inherit;}

/* HEADER */
.hdr{
  position:sticky;top:0;z-index:100;height:52px;
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:10px;
  box-shadow:var(--sh);
}
.logo{
  width:30px;height:30px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(140deg,var(--navy),var(--teal));
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:10px;
}
.brand-name{font-size:13px;font-weight:700;color:var(--navy);}
[data-dark] .brand-name{color:var(--teal);}
.brand-sub{font-size:10px;color:var(--sub);}
.hdr-nav{margin-left:auto;display:flex;align-items:center;gap:4px;}
.nav-a{
  padding:5px 9px;border-radius:var(--r-sm);
  font-size:11px;font-weight:500;color:var(--sub);
  display:flex;align-items:center;gap:3px;white-space:nowrap;
  transition:background var(--t),color var(--t);
}
.nav-a:hover{background:var(--bg);color:var(--text);}
.nav-a.on{background:var(--teal2);color:var(--teal);}
.icn-btn{
  width:32px;height:32px;border-radius:var(--r-sm);
  background:var(--bg);border:1px solid var(--border);
  color:var(--sub);cursor:pointer;font-size:14px;
  display:grid;place-items:center;transition:background var(--t);
}
.icn-btn:hover{background:var(--border);}

/* FILTER BAR */
.filter-bar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
}
.srch-wrap{position:relative;flex:1;min-width:180px;max-width:280px;}
.srch-wrap input{
  width:100%;padding:7px 10px 7px 30px;
  border:1.5px solid var(--border2);border-radius:var(--r-sm);
  background:var(--bg);color:var(--text);font-size:12px;outline:none;
  transition:border-color var(--t),box-shadow var(--t);
}
.srch-wrap input:focus{border-color:var(--teal);box-shadow:0 0 0 2px rgba(31,122,149,.1);}
.srch-wrap input::placeholder{color:var(--hint);}
.srch-ic{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--hint);font-size:12px;pointer-events:none;}
.flt{
  padding:7px 10px;border:1.5px solid var(--border2);border-radius:var(--r-sm);
  background:var(--bg);color:var(--text);font-size:12px;outline:none;cursor:pointer;
  transition:border-color var(--t);
}
.flt:focus{border-color:var(--teal);}
.date-grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.date-lbl{font-size:11px;color:var(--sub);font-weight:600;white-space:nowrap;}
.date-inp{
  padding:6px 8px;border:1.5px solid var(--border2);border-radius:var(--r-sm);
  background:var(--bg);color:var(--text);font-size:12px;outline:none;
  transition:border-color var(--t);width:130px;
}
.date-inp:focus{border-color:var(--teal);}
.sep{color:var(--hint);font-size:11px;}
.btn-search{
  padding:7px 14px;border-radius:var(--r-sm);
  background:linear-gradient(135deg,var(--teal),var(--navy));
  color:#fff;font-size:12px;font-weight:600;border:none;cursor:pointer;
  white-space:nowrap;box-shadow:0 1px 4px rgba(31,122,149,.25);
  transition:opacity var(--t);
}
.btn-search:hover{opacity:.9;}
.btn-clear{
  padding:7px 10px;border-radius:var(--r-sm);
  background:var(--bg);color:var(--sub);border:1px solid var(--border2);
  font-size:12px;cursor:pointer;white-space:nowrap;
  transition:background var(--t);
}
.btn-clear:hover{background:var(--border);}

/* STATS */
.stats-row{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:8px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;
}
.stat{display:flex;align-items:center;gap:5px;font-size:12px;}
.stat-dot{width:7px;height:7px;border-radius:50%;}
.stat-num{font-weight:700;font-size:14px;}
.stat-lbl{color:var(--sub);}
.result-info{margin-left:auto;font-size:11px;color:var(--hint);}

/* SORT CHIPS */
.sort-row{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:6px 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;
}
.sort-row::-webkit-scrollbar{display:none;}
.sort-chip{
  padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;
  background:var(--bg);color:var(--sub);border:1px solid var(--border);
  cursor:pointer;white-space:nowrap;transition:all var(--t);
  display:flex;align-items:center;gap:4px;
}
.sort-chip:hover{background:var(--teal2);color:var(--teal);border-color:var(--teal);}
.sort-chip.on{background:var(--teal);color:#fff;border-color:var(--teal);}
.sort-arrow{font-size:10px;}

/* TABLE WRAP */
.table-wrap{overflow-x:auto;padding:0 0 100px;}
.tbl{
  width:100%;border-collapse:collapse;min-width:900px;
}
.tbl thead{position:sticky;top:52px;z-index:50;}
.tbl th{
  background:var(--surface);color:var(--sub);
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
  padding:10px 12px;text-align:left;
  border-bottom:2px solid var(--border2);white-space:nowrap;cursor:pointer;
  user-select:none;transition:color var(--t);
}
.tbl th:hover{color:var(--teal);}
.tbl th.on{color:var(--teal);}
.tbl td{
  padding:9px 12px;border-bottom:1px solid var(--border);
  font-size:13px;vertical-align:middle;
}
.tbl tbody tr{transition:background var(--t);}
.tbl tbody tr:hover{background:var(--bg);}
.tbl tbody tr:last-child td{border-bottom:none;}

/* CELLS */
.cell-order{font-family:monospace;font-size:11px;color:var(--hint);}
.cell-person{display:flex;align-items:center;gap:7px;}
.av{
  width:26px;height:26px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--teal2),#b2dce8);
  display:grid;place-items:center;
  font-size:11px;font-weight:700;color:var(--teal);
}
[data-dark] .av{color:#fff;}
.cell-name{font-weight:600;font-size:13px;}
.cell-dept-sub{font-size:10px;color:var(--sub);}
.dept-tag{
  font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;
  background:var(--teal2);color:var(--teal);white-space:nowrap;
}
.cell-products{display:flex;flex-direction:column;gap:2px;}
.prod-line{
  display:flex;align-items:center;gap:5px;font-size:12px;
}
.prod-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.prod-name{color:var(--text);}
.prod-qty{color:var(--sub);font-size:11px;white-space:nowrap;}
.prod-more{font-size:10px;color:var(--hint);margin-top:1px;}

.badge{
  font-size:10px;font-weight:700;
  padding:3px 8px;border-radius:20px;white-space:nowrap;display:inline-block;
}
.badge-g{background:var(--g-bg);color:var(--g-text);}
.badge-r{background:var(--r-bg);color:var(--r-text);}
.badge-b{background:var(--b-bg);color:var(--b-text);}
.badge-y{background:var(--y-bg);color:var(--y-text);}

.cell-date{font-size:12px;color:var(--sub);white-space:nowrap;}
.cell-confirm{font-size:11px;color:var(--g-text);}

/* PAGINATION */
.pg-wrap{
  position:sticky;bottom:0;
  background:var(--surface);border-top:1px solid var(--border);
  padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:0 -2px 8px rgba(0,0,0,.06);
  z-index:50;
}
.pg-info{font-size:12px;color:var(--sub);}
.pg-btns{display:flex;gap:4px;}
.pg-btn{
  padding:5px 10px;border-radius:var(--r-sm);
  background:var(--bg);border:1px solid var(--border);
  font-size:12px;font-weight:600;color:var(--sub);cursor:pointer;
  transition:all var(--t);
}
.pg-btn:hover{background:var(--teal2);color:var(--teal);}
.pg-btn.on{background:var(--teal);color:#fff;border-color:var(--teal);}
.pg-btn:disabled{opacity:.35;cursor:not-allowed;}
.pg-size{
  padding:5px 8px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--bg);color:var(--text);font-size:12px;outline:none;cursor:pointer;
}

/* LOADING / EMPTY */
.ld{display:flex;flex-direction:column;align-items:center;gap:12px;padding:80px 20px;color:var(--sub);font-size:13px;}
.spin{width:32px;height:32px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--teal);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:80px 20px;color:var(--hint);}
.empty-ic{font-size:40px;margin-bottom:10px;}
.empty-tx{font-size:14px;font-weight:500;}

/* BOTTOM NAV */
.bot-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--surface);border-top:1px solid var(--border);
  padding:0 8px env(safe-area-inset-bottom);z-index:150;
  box-shadow:0 -2px 10px rgba(0,0,0,.07);
}
.bot-nav-inner{display:flex;justify-content:space-around;}
.bnav-a{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 12px;font-size:10px;font-weight:500;color:var(--sub);
  text-decoration:none;
}
.bnav-a.on{color:var(--teal);}
.bnav-ic{font-size:20px;line-height:1;}

@media(min-width:621px){.bot-nav{display:none;}.table-wrap{padding-bottom:0;}}
</style>
</head>
<body>

<header class="hdr">
  <div class="logo">BP</div>
  <div>
    <div class="brand-name">BeProud Clinic</div>
    <div class="brand-sub">ประวัติออเดอร์</div>
  </div>
  <nav class="hdr-nav">
    <a href="dashboard.html" class="nav-a">📋 ออเดอร์</a>
    <a href="my-orders.html" class="nav-a">👤 ของฉัน</a>
    <a href="history.html"   class="nav-a on">🗂 ประวัติ</a>
  </nav>
  <button class="icn-btn" id="themeBtn">🌙</button>
</header>

<!-- FILTER -->
<div class="filter-bar">
  <div class="srch-wrap">
    <span class="srch-ic">🔍</span>
    <input type="text" id="searchQ" placeholder="ค้นหาชื่อ แผนก สินค้า…">
  </div>
  <select class="flt" id="deptQ">
    <option value="">ทุกแผนก</option>
    <option>ธุรการ</option><option>ผู้ช่วย</option>
    <option>แม่บ้าน</option><option>Marketing</option><option>อื่นๆ</option>
  </select>
  <div class="date-grp">
    <span class="date-lbl">📅 ตั้งแต่</span>
    <input type="date" class="date-inp" id="fromDate">
    <span class="sep">—</span>
    <input type="date" class="date-inp" id="toDate">
  </div>
  <button class="btn-search" onclick="doSearch()">ค้นหา</button>
  <button class="btn-clear"  onclick="clearSearch()">ล้าง</button>
</div>

<!-- STATS -->
<div class="stats-row" id="statsRow" style="display:none">
  <div class="stat">
    <span class="stat-dot" style="background:var(--teal)"></span>
    <span class="stat-num" id="stTotal">0</span>
    <span class="stat-lbl">ออเดอร์</span>
  </div>
  <div class="stat">
    <span class="stat-dot" style="background:var(--g-dot)"></span>
    <span class="stat-num" id="stDone">0</span>
    <span class="stat-lbl">✅ เสร็จ</span>
  </div>
  <div class="stat">
    <span class="stat-dot" style="background:var(--r-dot)"></span>
    <span class="stat-num" id="stCancel">0</span>
    <span class="stat-lbl">❌ ยกเลิก</span>
  </div>
  <div class="stat">
    <span class="stat-dot" style="background:var(--gold)"></span>
    <span class="stat-num" id="stItems">0</span>
    <span class="stat-lbl">รายการ</span>
  </div>
  <div class="result-info" id="resultInfo"></div>
</div>

<!-- SORT CHIPS -->
<div class="sort-row" id="sortRow" style="display:none">
  <span style="font-size:11px;color:var(--sub);font-weight:600;white-space:nowrap;padding:4px 0">เรียงตาม:</span>
  <button class="sort-chip on" data-col="date" data-dir="desc" onclick="sortBy('date')">📅 วันที่ <span class="sort-arrow" id="arr-date">↓</span></button>
  <button class="sort-chip"    data-col="name" data-dir="asc"  onclick="sortBy('name')">👤 ชื่อ <span class="sort-arrow" id="arr-name"></span></button>
  <button class="sort-chip"    data-col="dept" data-dir="asc"  onclick="sortBy('dept')">🏢 แผนก <span class="sort-arrow" id="arr-dept"></span></button>
  <button class="sort-chip"    data-col="status" data-dir="asc" onclick="sortBy('status')">📊 สถานะ <span class="sort-arrow" id="arr-status"></span></button>
  <button class="sort-chip"    data-col="items" data-dir="desc" onclick="sortBy('items')">📦 จำนวน <span class="sort-arrow" id="arr-items"></span></button>
</div>

<!-- TABLE -->
<div class="table-wrap" id="tableWrap">
  <div class="ld"><div class="spin"></div>กำลังโหลดประวัติ…</div>
</div>

<!-- PAGINATION -->
<div class="pg-wrap" id="pgWrap" style="display:none">
  <div class="pg-info" id="pgInfo"></div>
  <div class="pg-btns" id="pgBtns"></div>
  <select class="pg-size" id="pgSize" onchange="onPageSizeChange()">
    <option value="20">20 / หน้า</option>
    <option value="50">50 / หน้า</option>
    <option value="100">100 / หน้า</option>
  </select>
</div>

<!-- BOTTOM NAV -->
<nav class="bot-nav">
  <div class="bot-nav-inner">
    <a href="dashboard.html" class="bnav-a"><span class="bnav-ic">📋</span>ออเดอร์</a>
    <a href="my-orders.html" class="bnav-a"><span class="bnav-ic">👤</span>ของฉัน</a>
    <a href="Stock_Check.html" class="bnav-a"><span class="bnav-ic">➕</span>สั่งของ</a>
    <a href="history.html"   class="bnav-a on"><span class="bnav-ic">🗂</span>ประวัติ</a>
  </div>
</nav>

<script>
const URL_ = 'https://script.google.com/macros/s/AKfycbwTvJBKmKC56TBodSnoweS-SoVtjLA0hBswziH6vpNSnWCAyMmHO1dgAVnvN84Yhod8/exec';
const DOTS = {'🟡 รอดำเนินการ':'#f59e0b','🔵 สั่งแล้ว รอของ':'#3b82f6','✅ ของมาแล้ว':'#22c55e','❌ ยกเลิก':'#ef4444'};

let dark = localStorage.getItem('bp-dk') === '1';
let allOrders = [], filtered = [], sorted = [];
let page = 1, pageSize = 20;
let sortCol = 'date', sortDir = 'desc';

function applyTheme(){
  document.body.toggleAttribute('data-dark', dark);
  document.getElementById('themeBtn').textContent = dark ? '☀️' : '🌙';
  localStorage.setItem('bp-dk', dark ? '1' : '0');
}
applyTheme();
document.getElementById('themeBtn').onclick = () => { dark = !dark; applyTheme(); };

// ── Load ──────────────────────────────────────────────
async function loadHistory() {
  try {
    const r = await fetch(`${URL_}?action=getHistory&page=1`);
    const j = await r.json();
    if (!j.success) throw new Error(j.data);
    allOrders = j.data.orders || [];
    filtered  = [...allOrders];
    applySort();
    updateStats();
    renderTable();
    document.getElementById('statsRow').style.display = 'flex';
    document.getElementById('sortRow').style.display  = 'flex';
  } catch(e) {
    document.getElementById('tableWrap').innerHTML =
      `<div class="empty"><div class="empty-ic">⚠️</div><div class="empty-tx">โหลดไม่ได้: ${e.message}</div></div>`;
  }
}

// ── Search ────────────────────────────────────────────
function doSearch() {
  const q    = document.getElementById('searchQ').value.trim().toLowerCase();
  const dept = document.getElementById('deptQ').value;
  const from = document.getElementById('fromDate').value;
  const to   = document.getElementById('toDate').value;

  filtered = allOrders.filter(o => {
    if (q) {
      const hit = o.name.toLowerCase().includes(q) ||
        o.dept.toLowerCase().includes(q) ||
        o.items.some(i => i.product.toLowerCase().includes(q));
      if (!hit) return false;
    }
    if (dept && o.dept !== dept) return false;
    if (from || to) {
      const d = parseDate(o.date);
      if (d) {
        if (from) {
          const [fy,fm,fd] = from.split('-').map(Number);
          if (d < new Date(fy,fm-1,fd)) return false;
        }
        if (to) {
          const [ty,tm,td] = to.split('-').map(Number);
          if (d > new Date(ty,tm-1,td,23,59,59)) return false;
        }
      }
    }
    return true;
  });

  page = 1;
  applySort();
  updateStats();
  renderTable();
}

function clearSearch() {
  document.getElementById('searchQ').value  = '';
  document.getElementById('deptQ').value    = '';
  document.getElementById('fromDate').value = '';
  document.getElementById('toDate').value   = '';
  filtered = [...allOrders];
  page = 1;
  applySort();
  updateStats();
  renderTable();
}

// ── Sort ──────────────────────────────────────────────
function sortBy(col) {
  if (sortCol === col) {
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    sortCol = col;
    sortDir = col === 'date' || col === 'items' ? 'desc' : 'asc';
  }
  // update chips
  document.querySelectorAll('.sort-chip').forEach(c => {
    c.classList.toggle('on', c.dataset.col === sortCol);
  });
  ['date','name','dept','status','items'].forEach(c => {
    const el = document.getElementById(`arr-${c}`);
    if (el) el.textContent = c === sortCol ? (sortDir==='asc'?'↑':'↓') : '';
  });
  applySort();
  renderTable();
}

function applySort() {
  sorted = [...filtered].sort((a, b) => {
    let av, bv;
    switch(sortCol) {
      case 'date':   av = parseDate(a.date)?.getTime()||0; bv = parseDate(b.date)?.getTime()||0; break;
      case 'name':   av = a.name; bv = b.name; break;
      case 'dept':   av = a.dept; bv = b.dept; break;
      case 'status': av = getStatusPriority(a); bv = getStatusPriority(b); break;
      case 'items':  av = a.items.length; bv = b.items.length; break;
      default:       return 0;
    }
    if (av < bv) return sortDir === 'asc' ? -1 : 1;
    if (av > bv) return sortDir === 'asc' ?  1 : -1;
    return 0;
  });
}

function getStatusPriority(o) {
  const stats = o.items.map(i => i.status);
  if (stats.every(s => s === '✅ ของมาแล้ว')) return 1;
  if (stats.every(s => s === '❌ ยกเลิก'))    return 3;
  return 2;
}

// ── Stats ─────────────────────────────────────────────
function updateStats() {
  let done=0, cancel=0, items=0;
  filtered.forEach(o => {
    o.items.forEach(i => {
      items++;
      if (i.status === '✅ ของมาแล้ว') done++;
      if (i.status === '❌ ยกเลิก')    cancel++;
    });
  });
  document.getElementById('stTotal').textContent  = filtered.length;
  document.getElementById('stDone').textContent   = done;
  document.getElementById('stCancel').textContent = cancel;
  document.getElementById('stItems').textContent  = items;
}

// ── Render Table ──────────────────────────────────────
function renderTable() {
  const total = sorted.length;
  const totalPages = Math.ceil(total / pageSize) || 1;
  if (page > totalPages) page = totalPages;
  const paged = sorted.slice((page-1)*pageSize, page*pageSize);

  document.getElementById('resultInfo').textContent =
    `แสดง ${(page-1)*pageSize+1}–${Math.min(page*pageSize,total)} จาก ${total} ออเดอร์`;

  if (!paged.length) {
    document.getElementById('tableWrap').innerHTML =
      `<div class="empty"><div class="empty-ic">📭</div><div class="empty-tx">ไม่พบประวัติออเดอร์</div></div>`;
    document.getElementById('pgWrap').style.display = 'none';
    return;
  }

  const rows = paged.map(o => {
    // status badge
    const stats = o.items.map(i => i.status);
    const allDone   = stats.every(s => s === '✅ ของมาแล้ว');
    const allCancel = stats.every(s => s === '❌ ยกเลิก');
    const mixed     = !allDone && !allCancel;
    let bc='badge-g', bt='✅ เสร็จสิ้น';
    if (allCancel) { bc='badge-r'; bt='❌ ยกเลิก'; }
    if (mixed)     { bc='badge-b'; bt='🔵 บางส่วน'; }

    // products (max 3)
    const prods = o.items.slice(0,3).map(it => `
      <div class="prod-line">
        <span class="prod-dot" style="background:${DOTS[it.status]||'#ccc'}"></span>
        <span class="prod-name">${it.product}</span>
        <span class="prod-qty">${it.qty} ${it.unit}</span>
      </div>`).join('');
    const more = o.items.length > 3
      ? `<div class="prod-more">+${o.items.length-3} รายการ</div>` : '';

    // confirmed by
    const confirmed = o.items.filter(i => i.confirmedBy).map(i => i.confirmedBy).filter((v,i,a)=>a.indexOf(v)===i);
    const confTxt = confirmed.length ? `✅ ${confirmed[0]}` : '';

    return `<tr>
      <td class="cell-order">#${o.orderId.slice(-8)}</td>
      <td>
        <div class="cell-person">
          <div class="av">${o.name.charAt(0)}</div>
          <div>
            <div class="cell-name">${o.name}</div>
          </div>
        </div>
      </td>
      <td><span class="dept-tag">${o.dept}</span></td>
      <td><div class="cell-products">${prods}${more}</div></td>
      <td style="text-align:center;font-weight:700;color:var(--sub)">${o.items.length}</td>
      <td><span class="badge ${bc}">${bt}</span></td>
      <td class="cell-date">${fmt(o.date)}</td>
      <td class="cell-confirm">${confTxt}</td>
    </tr>`;
  }).join('');

  document.getElementById('tableWrap').innerHTML = `
    <table class="tbl">
      <thead>
        <tr>
          <th onclick="sortBy('date')" class="${sortCol==='date'?'on':''}">🔖 รหัส</th>
          <th onclick="sortBy('name')" class="${sortCol==='name'?'on':''}">👤 ผู้สั่ง</th>
          <th onclick="sortBy('dept')" class="${sortCol==='dept'?'on':''}">🏢 แผนก</th>
          <th>📦 รายการสินค้า</th>
          <th onclick="sortBy('items')" class="${sortCol==='items'?'on':''}" style="text-align:center">จำนวน</th>
          <th onclick="sortBy('status')" class="${sortCol==='status'?'on':''}">📊 สถานะ</th>
          <th onclick="sortBy('date')" class="${sortCol==='date'?'on':''}">📅 วันที่สั่ง</th>
          <th>✅ ยืนยันรับโดย</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;

  // pagination
  renderPagination(page, totalPages, total);
}

function renderPagination(cur, total, totalItems) {
  const pg = document.getElementById('pgWrap');
  pg.style.display = 'flex';
  document.getElementById('pgInfo').textContent =
    `หน้า ${cur} / ${total} (${totalItems} ออเดอร์)`;

  let btns = `<button class="pg-btn" onclick="goPage(${cur-1})" ${cur===1?'disabled':''}>‹</button>`;
  const s = Math.max(1,cur-2), e = Math.min(total,cur+2);
  if (s>1) btns += `<button class="pg-btn" onclick="goPage(1)">1</button>${s>2?'<span style="padding:0 4px;color:var(--hint)">…</span>':''}`;
  for (let i=s;i<=e;i++) btns += `<button class="pg-btn${i===cur?' on':''}" onclick="goPage(${i})">${i}</button>`;
  if (e<total) btns += `${e<total-1?'<span style="padding:0 4px;color:var(--hint)">…</span>':''}<button class="pg-btn" onclick="goPage(${total})">${total}</button>`;
  btns += `<button class="pg-btn" onclick="goPage(${cur+1})" ${cur===total?'disabled':''}>›</button>`;
  document.getElementById('pgBtns').innerHTML = btns;
}

function goPage(n) {
  page = n;
  renderTable();
  document.getElementById('tableWrap').scrollIntoView({behavior:'smooth', block:'start'});
}

function onPageSizeChange() {
  pageSize = +document.getElementById('pgSize').value;
  page = 1;
  renderTable();
}

// ── Helpers ───────────────────────────────────────────
function parseDate(s) {
  if (!s) return null;
  try {
    const str = s.toString().trim();
    if (str.includes('GMT') || str.includes('UTC')) {
      const fixed = str.replace(/\b(25\d{2})\b/, y => String(Number(y) - 543));
      const d = new Date(fixed);
      return isNaN(d) ? null : d;
    }
    if (str.match(/^[A-Z][a-z]{2}\s/)) {
      const d = new Date(str);
      return isNaN(d) ? null : d;
    }
    const parts = str.split(' ')[0].split('/');
    if (parts.length === 3) {
      let [d, m, y] = parts.map(Number);
      if (y > 2500) y -= 543;
      return new Date(y, m-1, d);
    }
    return null;
  } catch { return null; }
}

function fmt(s) {
  const d = parseDate(s);
  if (!d) return '—';
  return d.toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'2-digit'});
}

// Enter to search
document.getElementById('searchQ').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

loadHistory();
