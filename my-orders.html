<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BeProud — ออเดอร์ของฉัน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#055367; --teal:#1F7A95; --teal2:#e6f4f8; --gold:#C2822B;
  --bg:#f0f2f5; --surface:#fff; --border:#e4e8ed;
  --text:#1a2030; --sub:#6b7585; --hint:#adb5c0;
  --y-bg:#fff8e6; --y-dot:#f59e0b; --y-text:#7c4a00;
  --b-bg:#e8f3ff; --b-dot:#3b82f6; --b-text:#1a4a80;
  --g-bg:#e8faf0; --g-dot:#22c55e; --g-text:#0d4f2a;
  --r-bg:#fff0f0; --r-dot:#ef4444; --r-text:#7a1a1a;
  --r:12px; --r-sm:8px;
  --sh:0 1px 4px rgba(0,0,0,.07);
  --sh2:0 4px 16px rgba(0,0,0,.10);
  --t:.18s ease;
}
[data-dark]{
  --bg:#10131a; --surface:#181d27; --border:#262d3a;
  --text:#e8ecf2; --sub:#8892a4; --hint:#444e60; --teal2:#0d2535;
  --y-bg:#261c04; --y-text:#fcd34d;
  --b-bg:#071830; --b-text:#93c5fd;
  --g-bg:#041a0e; --g-text:#86efac;
  --r-bg:#1a0404; --r-text:#fca5a5;
  --sh:0 1px 4px rgba(0,0,0,.3);
  --sh2:0 4px 16px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Sarabun',-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;font-size:15px;line-height:1.55;
  transition:background var(--t),color var(--t);
  -webkit-font-smoothing:antialiased;
}
a{text-decoration:none;color:inherit;}
button,select,input{font-family:inherit;font-size:inherit;}

/* HEADER */
.hdr{
  position:sticky;top:0;z-index:100;height:54px;
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:10px;
  box-shadow:var(--sh);
}
.logo{
  width:32px;height:32px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(140deg,var(--navy),var(--teal));
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;
  box-shadow:0 2px 6px rgba(5,83,103,.25);
}
.brand{flex:1;}
.brand-name{font-size:14px;font-weight:700;color:var(--navy);line-height:1.1;}
[data-dark] .brand-name{color:var(--teal);}
.brand-sub{font-size:10px;color:var(--sub);}
.hdr-nav{display:flex;align-items:center;gap:4px;}
.nav-a{
  padding:6px 10px;border-radius:var(--r-sm);
  font-size:12px;font-weight:500;color:var(--sub);
  display:flex;align-items:center;gap:4px;white-space:nowrap;
  transition:background var(--t),color var(--t);
}
.nav-a:hover{background:var(--bg);color:var(--text);}
.nav-a.on{background:var(--teal2);color:var(--teal);}
.icn-btn{
  width:34px;height:34px;border-radius:var(--r-sm);
  background:var(--bg);border:1px solid var(--border);
  color:var(--sub);cursor:pointer;font-size:15px;
  display:grid;place-items:center;
  transition:background var(--t),transform var(--t);
}
.icn-btn:hover{background:var(--border);}
.icn-btn:active{transform:scale(.9);}

/* SEARCH SECTION */
.search-sec{
  padding:20px 16px 0;
  max-width:560px;margin:0 auto;
}
.search-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:20px;
  box-shadow:var(--sh);
}
.search-title{
  font-size:16px;font-weight:700;margin-bottom:4px;
}
.search-desc{font-size:13px;color:var(--sub);margin-bottom:14px;}
.search-row{display:flex;gap:8px;}
.search-input{
  flex:1;padding:10px 14px;
  border:1.5px solid var(--border);border-radius:var(--r-sm);
  background:var(--bg);color:var(--text);font-size:14px;outline:none;
  transition:border-color var(--t),box-shadow var(--t);
}
.search-input:focus{
  border-color:var(--teal);
  box-shadow:0 0 0 3px rgba(31,122,149,.12);
}
.search-input::placeholder{color:var(--hint);}
.search-btn{
  padding:10px 18px;border-radius:var(--r-sm);
  background:linear-gradient(135deg,var(--teal),var(--navy));
  color:#fff;font-size:13px;font-weight:600;border:none;cursor:pointer;
  white-space:nowrap;
  box-shadow:0 2px 7px rgba(31,122,149,.28);
  transition:opacity var(--t),transform var(--t);
}
.search-btn:hover{opacity:.9;transform:translateY(-1px);}
.search-btn:active{transform:translateY(0);}

/* CONFIRM BANNER — จาก LINE link */
.confirm-banner{
  max-width:560px;margin:12px auto 0;padding:0 16px;
  display:none;
}
.confirm-banner.show{display:block;}
.banner-inner{
  background:linear-gradient(135deg,#e8faf0,#d1f5e0);
  border:1.5px solid var(--g-dot);
  border-radius:var(--r);padding:14px 16px;
  display:flex;align-items:center;gap:12px;
}
[data-dark] .banner-inner{background:linear-gradient(135deg,#041a0e,#062015);}
.banner-ic{font-size:24px;flex-shrink:0;}
.banner-txt{flex:1;}
.banner-title{font-size:13px;font-weight:700;color:var(--g-text);}
.banner-sub{font-size:12px;color:var(--g-text);opacity:.8;margin-top:1px;}

/* RESULTS */
.results{
  max-width:560px;margin:0 auto;
  padding:14px 16px 100px;
}
.results-hd{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.results-name{font-size:15px;font-weight:700;}
.results-count{font-size:12px;color:var(--sub);}

/* ORDER CARD */
.order-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);margin-bottom:10px;overflow:hidden;
  box-shadow:var(--sh);
  transition:box-shadow var(--t);
}
.order-card:hover{box-shadow:var(--sh2);}
.order-card.highlight{
  border-color:var(--g-dot);
  box-shadow:0 0 0 3px rgba(34,197,94,.15), var(--sh2);
  animation:pulse 1.5s ease 2;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 3px rgba(34,197,94,.15),var(--sh2);}
  50%{box-shadow:0 0 0 6px rgba(34,197,94,.25),var(--sh2);}
}

.oc-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;border-bottom:1px solid var(--border);
  gap:10px;
}
.oc-id{font-size:11px;font-family:monospace;color:var(--sub);}
.oc-date{font-size:11px;color:var(--hint);}
.oc-status-badge{
  font-size:10px;font-weight:700;
  padding:3px 9px;border-radius:20px;white-space:nowrap;
}
.badge-waiting{background:var(--y-bg);color:var(--y-text);}
.badge-ordered{background:var(--b-bg);color:var(--b-text);}
.badge-done{background:var(--g-bg);color:var(--g-text);}
.badge-cancelled{background:var(--r-bg);color:var(--r-text);}

.oc-items{padding:10px 14px;}
.oc-item{
  display:flex;align-items:center;gap:8px;
  padding:6px 0;border-bottom:1px solid var(--border);
}
.oc-item:last-child{border-bottom:none;}
.oi-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.oi-name{flex:1;font-size:13px;}
.oi-qty{font-size:12px;color:var(--sub);white-space:nowrap;}
.oi-confirm{
  display:flex;align-items:center;gap:4px;
  font-size:11px;color:var(--g-text);
}

/* CONFIRM BUTTON per item */
.confirm-row{
  padding:10px 14px;border-top:1px solid var(--border);
  background:var(--g-bg);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.confirm-row.hidden{display:none;}
.confirm-msg{font-size:12px;color:var(--g-text);flex:1;}
.confirm-btn{
  padding:7px 14px;border-radius:var(--r-sm);
  background:var(--g-dot);color:#fff;
  font-size:12px;font-weight:700;border:none;cursor:pointer;
  white-space:nowrap;
  box-shadow:0 2px 6px rgba(34,197,94,.3);
  transition:opacity var(--t),transform var(--t);
  display:flex;align-items:center;gap:5px;
}
.confirm-btn:hover{opacity:.88;transform:translateY(-1px);}
.confirm-btn:active{transform:translateY(0);}
.confirm-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

.confirmed-row{
  padding:10px 14px;border-top:1px solid var(--border);
  background:var(--g-bg);
  display:flex;align-items:center;gap:8px;
  font-size:12px;color:var(--g-text);
}
.confirmed-row.hidden{display:none;}

/* EMPTY / LOADING */
.empty-state{
  text-align:center;padding:48px 20px;color:var(--hint);
}
.empty-ic{font-size:40px;margin-bottom:10px;}
.empty-tx{font-size:14px;}
.empty-sub{font-size:12px;margin-top:4px;color:var(--hint);}

.ld{display:flex;flex-direction:column;align-items:center;gap:10px;padding:48px 20px;color:var(--sub);font-size:13px;}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--teal);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* TOAST */
.toast{
  position:fixed;bottom:80px;left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--text);color:var(--surface);
  padding:10px 18px;border-radius:24px;font-size:13px;font-weight:500;
  box-shadow:0 4px 18px rgba(0,0,0,.22);
  z-index:400;opacity:0;
  transition:opacity .2s,transform .2s;
  pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* BOTTOM NAV */
.bot-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--surface);border-top:1px solid var(--border);
  padding:0 8px env(safe-area-inset-bottom);
  z-index:150;box-shadow:0 -2px 10px rgba(0,0,0,.07);
}
.bot-nav-inner{display:flex;justify-content:space-around;}
.bnav-a{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 12px;border-radius:var(--r-sm);
  font-size:10px;font-weight:500;color:var(--sub);
  cursor:pointer;transition:color var(--t);
  text-decoration:none;
}
.bnav-a.on{color:var(--teal);}
.bnav-ic{font-size:20px;line-height:1;}

@media(min-width:621px){
  .bot-nav{display:none;}
  .results,.search-sec,.confirm-banner{padding-bottom:32px;}
}
@media(max-width:620px){
  .hdr-nav .nav-a span{display:none;}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="logo">BP</div>
  <div class="brand">
    <div class="brand-name">BeProud Clinic</div>
    <div class="brand-sub">ออเดอร์ของฉัน</div>
  </div>
  <nav class="hdr-nav">
    <a href="dashboard.html" class="nav-a">📋 <span>ออเดอร์</span></a>
    <a href="my-orders.html" class="nav-a on">👤 <span>ของฉัน</span></a>
    <a href="history.html"   class="nav-a">🗂 <span>ประวัติ</span></a>
  </nav>
  <button class="icn-btn" id="themeBtn">🌙</button>
</header>

<!-- CONFIRM BANNER (จาก LINE link) -->
<div class="confirm-banner" id="confirmBanner">
  <div class="banner-inner">
    <div class="banner-ic">📦</div>
    <div class="banner-txt">
      <div class="banner-title">ของมาแล้ว! กรุณายืนยันรับของ</div>
      <div class="banner-sub" id="bannerSub">กำลังโหลดรายละเอียด…</div>
    </div>
  </div>
</div>

<!-- SEARCH -->
<div class="search-sec">
  <div class="search-card">
    <div class="search-title">👤 ค้นหาออเดอร์ของคุณ</div>
    <div class="search-desc">พิมพ์ชื่อของคุณเพื่อดูสถานะออเดอร์ทั้งหมด</div>
    <div class="search-row">
      <input class="search-input" id="nameInput" type="text" placeholder="เช่น เกวลี, ปานหทัย, กี้…" autocomplete="off">
      <button class="search-btn" id="searchBtn">ค้นหา</button>
    </div>
  </div>
</div>

<!-- RESULTS -->
<div class="results" id="results" style="display:none"></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- BOTTOM NAV -->
<nav class="bot-nav">
  <div class="bot-nav-inner">
    <a href="dashboard.html" class="bnav-a"><span class="bnav-ic">📋</span>ออเดอร์</a>
    <a href="my-orders.html" class="bnav-a on"><span class="bnav-ic">👤</span>ของฉัน</a>
    <a href="Stock_Check.html" class="bnav-a"><span class="bnav-ic">➕</span>สั่งของ</a>
    <a href="history.html"   class="bnav-a"><span class="bnav-ic">🗂</span>ประวัติ</a>
  </div>
</nav>

<script>
const URL_ = 'https://script.google.com/macros/s/AKfycbwTvJBKmKC56TBodSnoweS-SoVtjLA0hBswziH6vpNSnWCAyMmHO1dgAVnvN84Yhod8/exec';
const DOTS = {'🟡 รอดำเนินการ':'#f59e0b','🔵 สั่งแล้ว รอของ':'#3b82f6','✅ ของมาแล้ว':'#22c55e','❌ ยกเลิก':'#ef4444'};

let dark = localStorage.getItem('bp-dk') === '1';
function applyTheme(){
  document.body.toggleAttribute('data-dark', dark);
  document.getElementById('themeBtn').textContent = dark ? '☀️' : '🌙';
  localStorage.setItem('bp-dk', dark ? '1' : '0');
}
applyTheme();
document.getElementById('themeBtn').onclick = () => { dark = !dark; applyTheme(); };

// ── URL Params ──────────────────────────────────────
const params  = new URLSearchParams(location.search);
const urlName = params.get('name') || '';
const urlOrderId = params.get('orderId') || '';

// ── Auto-load จาก LINE link ──────────────────────────
if (urlName) {
  document.getElementById('nameInput').value = urlName;
  // แสดง banner ถ้ามา confirm
  if (urlOrderId) {
    document.getElementById('confirmBanner').classList.add('show');
    document.getElementById('bannerSub').textContent = `ออเดอร์ #${urlOrderId.slice(-8)} · ${urlName}`;
  }
  window.addEventListener('load', () => searchOrders(urlName));
}

// ── Search ───────────────────────────────────────────
document.getElementById('searchBtn').onclick = () => {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { toast('กรุณาพิมพ์ชื่อก่อนนะคะ'); return; }
  searchOrders(name);
};
document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('searchBtn').click();
});

// ── Remember last search ─────────────────────────────
const lastN = localStorage.getItem('bp-myname');
if (lastN && !urlName) {
  document.getElementById('nameInput').value = lastN;
}

async function searchOrders(name) {
  localStorage.setItem('bp-myname', name);
  const res = document.getElementById('results');
  res.style.display = 'block';
  res.innerHTML = '<div class="ld"><div class="spin"></div>กำลังโหลด…</div>';

  try {
    const p = new URLSearchParams({ action: 'getOrders', name });
    const r = await fetch(`${URL_}?${p}`);
    const j = await r.json();
    if (!j.success) throw new Error(j.data);

    const all = [
      ...(j.data.waiting||[]),
      ...(j.data.ordered||[]),
      ...(j.data.done||[]),
      ...(j.data.cancelled||[]),
    ].filter(o => o.name.toLowerCase().includes(name.toLowerCase()));

    renderResults(all, name);
  } catch(e) {
    res.innerHTML = `<div class="empty-state"><div class="empty-ic">⚠️</div><div class="empty-tx">โหลดไม่ได้</div><div class="empty-sub">${e.message}</div></div>`;
  }
}

function renderResults(orders, name) {
  const res = document.getElementById('results');
  if (!orders.length) {
    res.innerHTML = `
      <div class="empty-state">
        <div class="empty-ic">📭</div>
        <div class="empty-tx">ไม่พบออเดอร์ของ "${name}"</div>
        <div class="empty-sub">ลองพิมพ์ชื่อใหม่ หรือตรวจสอบการสะกด</div>
      </div>`;
    return;
  }

  // เรียงล่าสุดก่อน
  orders.sort((a, b) => b.orderId.localeCompare(a.orderId));

  const totalItems = orders.reduce((n, o) => n + o.items.length, 0);
  const html = `
    <div class="results-hd">
      <span class="results-name">📦 ออเดอร์ของ ${orders[0].name}</span>
      <span class="results-count">${orders.length} ออเดอร์ · ${totalItems} รายการ</span>
    </div>
    ${orders.map(o => orderCard(o)).join('')}`;
  res.innerHTML = html;

  // scroll ไป highlight card ถ้ามา confirm
  if (urlOrderId) {
    setTimeout(() => {
      const el = document.getElementById(`card-${urlOrderId}`);
      if (el) { el.scrollIntoView({ behavior:'smooth', block:'center' }); }
    }, 300);
  }

  // bind confirm buttons
  document.querySelectorAll('.confirm-btn').forEach(btn => {
    btn.addEventListener('click', () => confirmItem(
      btn.dataset.orderId,
      parseInt(btn.dataset.idx),
      btn.dataset.name,
      btn
    ));
  });
}

function orderCard(o) {
  const hasDone  = o.items.some(i => i.status === '✅ ของมาแล้ว');
  const allDone  = o.items.every(i => i.status === '✅ ของมาแล้ว' || i.status === '❌ ยกเลิก');
  const isHL     = o.orderId === urlOrderId;

  // overall badge
  const hasWaiting   = o.items.some(i => i.status === '🟡 รอดำเนินการ');
  const hasOrdered   = o.items.some(i => i.status === '🔵 สั่งแล้ว รอของ');
  const allCancelled = o.items.every(i => i.status === '❌ ยกเลิก');

  let badgeCls = 'badge-ordered', badgeTx = '🔵 สั่งแล้ว รอของ';
  if (hasWaiting)       { badgeCls='badge-waiting';   badgeTx='🟡 รอดำเนินการ'; }
  else if (allDone)     { badgeCls='badge-done';       badgeTx='✅ เสร็จสิ้น'; }
  else if (hasDone)     { badgeCls='badge-ordered';    badgeTx='🔵 บางรายการมาแล้ว'; }
  else if (allCancelled){ badgeCls='badge-cancelled';  badgeTx='❌ ยกเลิก'; }

  // items list
  const itemsHtml = o.items.map((it, idx) => {
    const dot = DOTS[it.status] || '#ccc';
    const needConfirm = it.status === '✅ ของมาแล้ว' && !it.confirmedAt;
    const confirmed   = it.status === '✅ ของมาแล้ว' && it.confirmedAt;
    return `
      <div class="oc-item">
        <span class="oi-dot" style="background:${dot}"></span>
        <span class="oi-name">${it.product}</span>
        <span class="oi-qty">${it.qty} ${it.unit}</span>
        ${needConfirm
          ? `<button class="confirm-btn" data-order-id="${o.orderId}" data-idx="${idx}" data-name="${o.name}" id="cbtn-${o.orderId}-${idx}">✅ รับแล้ว</button>`
          : confirmed
            ? `<span class="oi-confirm">✅ รับแล้ว</span>`
            : ''}
      </div>`;
  }).join('');

  // unconfirmed done items
  const unconfirmed = o.items.filter((it, idx) => it.status === '✅ ของมาแล้ว' && !it.confirmedAt);

  return `
    <div class="order-card${isHL ? ' highlight' : ''}" id="card-${o.orderId}">
      <div class="oc-header">
        <div>
          <div class="oc-id">#${o.orderId.slice(-8)}</div>
          <div class="oc-date">📅 ${fmt(o.date)}</div>
        </div>
        <span class="oc-status-badge ${badgeCls}">${badgeTx}</span>
      </div>
      <div class="oc-items">${itemsHtml}</div>
      ${unconfirmed.length > 0 ? `
        <div class="confirm-row" id="crow-${o.orderId}">
          <span class="confirm-msg">📦 ของมาแล้ว ${unconfirmed.length} รายการ — กดยืนยันรับของด้านบนนะคะ</span>
        </div>` : ''}
    </div>`;
}

// ── Confirm ──────────────────────────────────────────
async function confirmItem(orderId, itemIndex, name, btn) {
  btn.disabled = true;
  btn.textContent = '⏳ กำลังยืนยัน…';
  try {
    const r = await fetch(URL_, {
      method: 'POST',
      body: JSON.stringify({
        action: 'confirmReceipt',
        orderId, itemIndex,
        confirmedBy: name,
      }),
    });
    const j = await r.json();
    if (!j.success && j.data?.message) {
      toast('ℹ️ ' + j.data.message); btn.disabled = false; btn.textContent = '✅ รับแล้ว'; return;
    }
    if (!j.success) throw new Error(j.data);

    // อัปเดต UI ทันที
    btn.outerHTML = `<span class="oi-confirm">✅ รับแล้ว</span>`;

    // ซ่อน banner row ถ้าไม่มีรายการที่ต้อง confirm แล้ว
    const crow = document.getElementById(`crow-${orderId}`);
    const remaining = document.querySelectorAll(`[data-order-id="${orderId}"]`);
    if (remaining.length === 0 && crow) crow.classList.add('hidden');

    toast('✅ ยืนยันรับของเรียบร้อยแล้วค่ะ!');
    document.getElementById('confirmBanner').classList.remove('show');
  } catch(e) {
    toast('❌ ยืนยันไม่สำเร็จ กรุณาลองใหม่');
    btn.disabled = false;
    btn.textContent = '✅ รับแล้ว';
  }
}

// ── Helpers ──────────────────────────────────────────
function fmt(s) {
  if (!s) return '—';
  try {
    const d = s.includes('GMT') ? new Date(s) : (() => {
      const [dm] = s.split(' ');
      const [dd,mm,yy] = dm.split('/').map(Number);
      return new Date(yy > 2500 ? yy-543 : yy, mm-1, dd);
    })();
    return d.toLocaleDateString('th-TH', { day:'numeric', month:'short', year:'2-digit' });
  } catch { return s.split(' ')[0]; }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
