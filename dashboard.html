<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeProud — จัดการออเดอร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Design Tokens ─────────────────────────────────── */
:root {
  --navy:       #055367;
  --teal:       #1F7A95;
  --teal-light: #e8f4f8;
  --gold:       #C2822B;
  --gold-light: #fdf3e7;
  --cream:      #F4F4E8;

  --bg:         #f5f6f8;
  --surface:    #ffffff;
  --surface2:   #fafafa;
  --border:     #eaedf0;
  --border2:    #dde1e6;

  --text:       #1e2530;
  --text-sub:   #7a8494;
  --text-hint:  #b0b8c4;

  --waiting-bg:    #fffbeb;  --waiting-border: #fde68a;  --waiting-fg:  #92400e; --waiting-dot: #f59e0b;
  --ordered-bg:    #eff8ff;  --ordered-border: #bae3ff;  --ordered-fg:  #1e5a8a; --ordered-dot: #3b82f6;
  --done-bg:       #f0fdf6;  --done-border:    #bbf7d0;  --done-fg:     #14532d; --done-dot:    #22c55e;
  --cancelled-bg:  #fff5f5;  --cancelled-border:#fecaca; --cancelled-fg:#7f1d1d; --cancelled-dot:#ef4444;

  --radius-sm:  8px;
  --radius:     12px;
  --radius-lg:  16px;
  --shadow-sm:  0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow:     0 2px 8px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.05);
  --shadow-md:  0 6px 20px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06);
  --shadow-lg:  0 20px 60px rgba(0,0,0,.15);
  --t:          .2s ease;
}

[data-theme="dark"] {
  --bg:         #111418;
  --surface:    #1a1e25;
  --surface2:   #1f242d;
  --border:     #272d38;
  --border2:    #323a47;
  --text:       #edf0f5;
  --text-sub:   #8a94a6;
  --text-hint:  #505a6a;

  --teal-light: #0e2a35;
  --gold-light: #2a1e0a;
  --cream:      #1a1e25;

  --waiting-bg:    #2a1f06;  --waiting-border: #78420a;  --waiting-fg:  #fcd34d;
  --ordered-bg:    #0a1e30;  --ordered-border: #1e4a70;  --ordered-fg:  #7dd3fc;
  --done-bg:       #061a10;  --done-border:    #166534;  --done-fg:     #86efac;
  --cancelled-bg:  #1e0606;  --cancelled-border:#7f1d1d; --cancelled-fg:#fca5a5;

  --shadow-sm:  0 1px 3px rgba(0,0,0,.3);
  --shadow:     0 2px 8px rgba(0,0,0,.4);
  --shadow-md:  0 6px 20px rgba(0,0,0,.5);
}

/* ── Base ──────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Sarabun', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.6;
  transition: background var(--t), color var(--t);
}
a { text-decoration: none; color: inherit; }
button, select, input { font-family: inherit; }

/* ── Header ────────────────────────────────────────── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  height: 60px; gap: 16px;
  box-shadow: var(--shadow-sm);
}
.header-brand { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, var(--navy) 0%, var(--teal) 100%);
  display: grid; place-items: center;
  color: #fff; font-weight: 700; font-size: 12px; letter-spacing: .5px;
  box-shadow: 0 2px 8px rgba(5,83,103,.3);
}
.brand-text { line-height: 1.2; }
.brand-name { font-size: 15px; font-weight: 700; color: var(--navy); }
[data-theme="dark"] .brand-name { color: var(--teal); }
.brand-sub  { font-size: 11px; color: var(--text-sub); font-weight: 400; }

.header-nav { display: flex; align-items: center; gap: 6px; }

.nav-link {
  padding: 7px 13px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500; color: var(--text-sub);
  transition: background var(--t), color var(--t);
  display: flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.nav-link:hover { background: var(--bg); color: var(--text); }
.nav-link.active { background: var(--teal-light); color: var(--teal); }

.btn-order {
  padding: 8px 16px; border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--teal) 0%, var(--navy) 100%);
  color: #fff; font-size: 13px; font-weight: 600;
  border: none; cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  box-shadow: 0 2px 8px rgba(31,122,149,.35);
  transition: opacity var(--t), transform var(--t);
}
.btn-order:hover { opacity: .9; transform: translateY(-1px); }
.btn-order:active { transform: translateY(0); }

.btn-icon {
  width: 36px; height: 36px; border-radius: var(--radius-sm);
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text-sub); cursor: pointer; font-size: 16px;
  display: grid; place-items: center;
  transition: background var(--t), color var(--t), transform var(--t);
}
.btn-icon:hover { background: var(--bg); color: var(--text); }
.btn-icon:active { transform: scale(.92); }

/* ── Summary bar ───────────────────────────────────── */
.summary-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex; align-items: center; gap: 0; overflow-x: auto;
}
.summary-bar::-webkit-scrollbar { height: 0; }

.summary-item {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 20px; border-right: 1px solid var(--border);
  min-width: 130px; cursor: default;
  transition: background var(--t);
}
.summary-item:first-child { padding-left: 0; }
.summary-item:hover { background: var(--bg); }

.summary-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
}
.summary-info { line-height: 1.2; }
.summary-num  { font-size: 20px; font-weight: 700; color: var(--text); }
.summary-label{ font-size: 11px; color: var(--text-sub); font-weight: 500; }

.summary-right { margin-left: auto; padding-left: 20px; display: flex; align-items: center; gap: 8px; }

/* ── Toolbar ───────────────────────────────────────── */
.toolbar {
  padding: 12px 24px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.search-wrap {
  position: relative; flex: 1; min-width: 200px; max-width: 300px;
}
.search-wrap input {
  width: 100%; padding: 8px 12px 8px 36px;
  border: 1px solid var(--border2); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text);
  font-size: 13px; outline: none; font-family: inherit;
  transition: border-color var(--t), box-shadow var(--t);
}
.search-wrap input:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(31,122,149,.1);
}
.search-wrap input::placeholder { color: var(--text-hint); }
.search-icon {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  color: var(--text-hint); font-size: 14px; pointer-events: none;
}
.filter-select {
  padding: 8px 12px; border: 1px solid var(--border2); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text); font-size: 13px; outline: none;
  cursor: pointer; font-family: inherit;
  transition: border-color var(--t);
}
.filter-select:focus { border-color: var(--teal); }

.refresh-hint { font-size: 12px; color: var(--text-hint); margin-left: auto; }

/* ── Board ─────────────────────────────────────────── */
.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  padding: 0 24px 32px;
  align-items: start;
}
@media (max-width: 960px)  { .board { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 580px)  {
  .board { grid-template-columns: 1fr; padding: 0 12px 24px; }
  .toolbar { padding: 10px 12px; }
  .header { padding: 0 14px; height: 54px; }
  .summary-bar { padding: 0 14px; }
  .brand-sub { display: none; }
  .header-nav .nav-link span { display: none; }
  .refresh-hint { display: none; }
}

/* ── Column ────────────────────────────────────────── */
.column {
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--surface2);
  box-shadow: var(--shadow-sm);
}

.col-header {
  padding: 12px 16px;
  display: flex; align-items: center; gap: 8px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.col-stripe {
  width: 4px; height: 20px; border-radius: 2px; flex-shrink: 0;
}
.col-title { font-size: 13px; font-weight: 700; flex: 1; letter-spacing: .1px; }
.col-count {
  font-size: 12px; font-weight: 700;
  padding: 2px 8px; border-radius: 20px;
  background: var(--border); color: var(--text-sub);
}
.col-toggle {
  font-size: 11px; color: var(--teal); cursor: pointer;
  background: none; border: none; font-family: inherit; font-weight: 600;
  padding: 2px 6px; border-radius: 6px;
}
.col-toggle:hover { background: var(--teal-light); }

.col-body {
  padding: 10px;
  display: flex; flex-direction: column; gap: 8px;
  min-height: 48px;
}
.col-body.hidden { display: none; }

.col-empty {
  padding: 32px 16px; text-align: center; color: var(--text-hint);
}
.col-empty-icon { font-size: 28px; margin-bottom: 8px; }
.col-empty-text { font-size: 13px; }

/* ── Card ──────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 13px 14px;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: box-shadow var(--t), transform var(--t), border-color var(--t);
  position: relative; overflow: hidden;
}
.card::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  border-radius: 2px 0 0 2px;
}
.card.waiting::before  { background: var(--waiting-dot); }
.card.ordered::before  { background: var(--ordered-dot); }
.card.done::before     { background: var(--done-dot); }
.card.cancelled::before{ background: var(--cancelled-dot); }

.card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
  border-color: var(--border2);
}
.card:active { transform: translateY(-1px); }

.card-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 8px; margin-bottom: 9px;
}
.card-person { display: flex; align-items: center; gap: 7px; }
.card-avatar {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--teal-light), var(--teal));
  display: grid; place-items: center;
  font-size: 12px; font-weight: 700; color: var(--teal);
}
[data-theme="dark"] .card-avatar { color: #fff; }
.card-name { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.2; }
.card-dept {
  font-size: 10px; color: var(--text-sub); font-weight: 500;
  margin-top: 1px;
}
.dept-tag {
  font-size: 10px; padding: 2px 8px; border-radius: 20px;
  background: var(--teal-light); color: var(--teal); font-weight: 600;
  white-space: nowrap; flex-shrink: 0;
}

.card-items { margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
.card-item {
  display: flex; align-items: center; gap: 6px; font-size: 12px;
  padding: 3px 0;
}
.item-dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
}
.item-name { flex: 1; color: var(--text); font-weight: 400; }
.item-qty  { color: var(--text-sub); font-size: 11px; white-space: nowrap; }
.card-more { font-size: 11px; color: var(--text-hint); padding: 2px 0 0 12px; }

.card-foot {
  display: flex; align-items: center; justify-content: space-between;
  padding-top: 8px; border-top: 1px solid var(--border);
}
.card-date { font-size: 11px; color: var(--text-hint); display: flex; align-items: center; gap: 4px; }
.card-id   { font-size: 10px; color: var(--text-hint); font-family: monospace; }

/* ── Modal ─────────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(10,15,25,.5);
  display: none; place-items: center;
  z-index: 200; padding: 16px;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.overlay.open { display: grid; }

.modal {
  background: var(--surface);
  border-radius: var(--radius-lg);
  width: 100%; max-width: 500px;
  max-height: 88vh; overflow-y: auto;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border);
  animation: modalIn .22s cubic-bezier(.34,1.56,.64,1);
}
@keyframes modalIn {
  from { opacity:0; transform: scale(.94) translateY(12px); }
  to   { opacity:1; transform: scale(1)   translateY(0); }
}

.modal-header {
  padding: 18px 20px 0;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
}
.modal-title-wrap {}
.modal-title { font-size: 17px; font-weight: 700; line-height: 1.2; }
.modal-sub   { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
.modal-close {
  width: 32px; height: 32px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface2);
  color: var(--text-sub); cursor: pointer; font-size: 16px;
  display: grid; place-items: center; flex-shrink: 0;
  transition: background var(--t), color var(--t);
}
.modal-close:hover { background: var(--cancelled-bg); color: var(--cancelled-fg); }

.modal-body { padding: 16px 20px 20px; }

.info-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; margin-bottom: 16px;
}
.info-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 12px;
}
.info-card-label { font-size: 11px; color: var(--text-sub); font-weight: 600; margin-bottom: 2px; text-transform: uppercase; letter-spacing: .4px; }
.info-card-val   { font-size: 14px; font-weight: 600; }

.section-title {
  font-size: 12px; font-weight: 700; color: var(--text-sub);
  text-transform: uppercase; letter-spacing: .5px;
  margin-bottom: 8px; margin-top: 16px;
}

.item-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 0; border-bottom: 1px solid var(--border);
}
.item-row:last-child { border-bottom: none; }
.item-row-num {
  width: 22px; height: 22px; border-radius: 6px;
  background: var(--bg); color: var(--text-sub);
  display: grid; place-items: center; font-size: 11px; font-weight: 700;
  flex-shrink: 0;
}
.item-row-info { flex: 1; min-width: 0; }
.item-row-name { font-size: 13px; font-weight: 600; }
.item-row-note { font-size: 11px; color: var(--text-sub); }
.item-row-qty  { font-size: 12px; color: var(--text-sub); white-space: nowrap; }
.item-row-sel  {
  padding: 5px 8px; border-radius: var(--radius-sm); font-size: 12px;
  border: 1px solid var(--border); background: var(--surface2); color: var(--text);
  cursor: pointer; font-family: inherit; min-width: 150px;
  transition: border-color var(--t);
}
.item-row-sel:focus { border-color: var(--teal); outline: none; }

.admin-field { margin-top: 14px; }
.admin-label { font-size: 12px; color: var(--text-sub); font-weight: 600; margin-bottom: 5px; display: block; }
.admin-input {
  width: 100%; padding: 8px 12px;
  border: 1px solid var(--border2); border-radius: var(--radius-sm);
  background: var(--surface2); color: var(--text);
  font-size: 13px; outline: none; font-family: inherit;
  transition: border-color var(--t), box-shadow var(--t);
}
.admin-input:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(31,122,149,.1);
}

.modal-footer {
  display: flex; gap: 8px; justify-content: flex-end;
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  background: var(--surface2);
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
}
.btn {
  padding: 9px 18px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text); font-family: inherit;
  transition: background var(--t), transform var(--t);
  display: flex; align-items: center; gap: 6px;
}
.btn:hover { background: var(--bg); }
.btn-save {
  background: linear-gradient(135deg, var(--teal), var(--navy));
  color: #fff; border-color: transparent;
  box-shadow: 0 2px 8px rgba(31,122,149,.3);
}
.btn-save:hover { opacity: .92; }
.btn-save:disabled { opacity: .5; cursor: not-allowed; }
.btn:active { transform: scale(.97); }

/* ── Toast ─────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(8px);
  background: var(--text); color: var(--surface);
  padding: 11px 20px; border-radius: 30px; font-size: 13px; font-weight: 500;
  box-shadow: 0 4px 20px rgba(0,0,0,.25);
  z-index: 300; opacity: 0;
  transition: opacity .22s, transform .22s;
  pointer-events: none; white-space: nowrap;
  display: flex; align-items: center; gap: 8px;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Loading ────────────────────────────────────────── */
.loading-wrap {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 80px 20px; gap: 14px;
  color: var(--text-sub); font-size: 14px;
}
.spinner {
  width: 36px; height: 36px; border-radius: 50%;
  border: 3px solid var(--border);
  border-top-color: var(--teal);
  animation: spin .75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.error-wrap {
  text-align: center; padding: 60px 20px;
  color: var(--cancelled-fg); font-size: 14px;
}
</style>
</head>
<body>

<!-- ── Header ── -->
<header class="header">
  <div class="header-brand">
    <div class="logo">BP</div>
    <div class="brand-text">
      <div class="brand-name">BeProud Clinic</div>

<!-- ── Summary bar ── -->

    <div class="summary-info">
      <div class="summary-num" id="cntWaiting">—</div>

  </div>
  <div class="summary-item">
    <span class="summary-dot" style="background:#3b82f6"></span>
    <div class="summary-info">
      <div class="summary-num" id="cntOrdered">—</div>
      <div class="summary-label">สั่งแล้ว รอของ</div>
    </div>
  </div>
  <div class="summary-item">
    <span class="summary-dot" style="background:#22c55e"></span>
    <div class="summary-info">
      <div class="summary-num" id="cntDone">—</div>
      <div class="summary-label">ของมาแล้ว</div>
    </div>

  <div class="summary-item" style="border-right:none">
    <span class="summary-dot" style="background:#ef4444"></span>

      <div class="summary-num" id="cntCancelled">—</div>

<!-- ── Toolbar ── -->
<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="ค้นหาชื่อ หรือสินค้า…">
  </div>

    <option value="">ทุกแผนก</option>
    <option value="ธุรการ">ธุรการ</option>
    <option value="ผู้ช่วย">ผู้ช่วย</option>
    <option value="แม่บ้าน">แม่บ้าน</option>
    <option value="Marketing">Marketing</option>
    <option value="อื่นๆ">อื่นๆ</option>
  </select>
  <span class="refresh-hint" id="lastRefresh"></span>
</div>

<!-- ── Board ── -->
<div id="boardWrap">
  <div class="loading-wrap">
    <div class="spinner"></div>กำลังโหลดข้อมูล…
  </div>
</div>

<!-- ── Modal ── -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-title-wrap">
        <div class="modal-title" id="mTitle">รายละเอียดออเดอร์</div>
        <div class="modal-sub"  id="mSub"></div>
      </div>
      <button class="modal-close" id="mClose">✕</button>
    </div>
    <div class="modal-body" id="mBody"></div>
    <div class="modal-footer">
      <button class="btn" id="mCancel">ยกเลิก</button>
      <button class="btn btn-save" id="mSave">💾 บันทึกสถานะ</button>
    </div>
  </div>
</div>

<!-- ── Toast ── -->
<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzY29FcDzt90fuOypyqkAVyRnSZRE8eiX_5C2efjvH7pXlvD9SCxa4jvBKy_cvZ6Mq5/exec';

let allData  = { waiting:[], ordered:[], done:[], cancelled:[] };
let searchQ  = '';
let deptQ    = '';
let showDone = false;
let curOrder = null;
let dark     = localStorage.getItem('bp-dark') === '1';

// ── Theme ──
function applyTheme() {
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.getElementById('themeBtn').textContent = dark ? '☀️' : '🌙';
  localStorage.setItem('bp-dark', dark ? '1' : '0');
}
applyTheme();
document.getElementById('themeBtn').addEventListener('click', () => { dark = !dark; applyTheme(); });

// ── Load ──
async function load() {
  document.getElementById('boardWrap').innerHTML =
    '<div class="loading-wrap"><div class="spinner"></div>กำลังโหลดข้อมูล…</div>';
  try {
    const p = new URLSearchParams({ action:'getOrders' });
    if (deptQ) p.set('dept', deptQ);
    const r = await fetch(`${SCRIPT_URL}?${p}`);
    const j = await r.json();
    if (!j.success) throw new Error(j.data);
    allData = j.data;
    updateSummary();
    render();
    document.getElementById('lastRefresh').textContent =
      'อัปเดต ' + new Date().toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
  } catch(e) {
    document.getElementById('boardWrap').innerHTML =
      `<div class="error-wrap">⚠️ โหลดข้อมูลไม่ได้<br><small style="color:var(--text-sub)">${e.message}</small><br><br>
       <button class="btn" onclick="load()" style="margin:auto">ลองใหม่</button></div>`;
  }
}

function updateSummary() {
  document.getElementById('cntWaiting').textContent   = (allData.waiting||[]).length;
  document.getElementById('cntOrdered').textContent   = (allData.ordered||[]).length;
  document.getElementById('cntDone').textContent      = (allData.done||[]).length;
  document.getElementById('cntCancelled').textContent = (allData.cancelled||[]).length;
}

// ── Filter ──
function filtered(list) {
  if (!searchQ) return list;
  const q = searchQ.toLowerCase();
  return list.filter(o =>
    o.name.toLowerCase().includes(q) ||
    o.dept.toLowerCase().includes(q) ||
    o.items.some(i => i.product.toLowerCase().includes(q))
  );
}

// ── Render ──
function render() {
  const w = filtered(allData.waiting   || []);
  const o = filtered(allData.ordered   || []);
  const d = filtered(allData.done      || []);

  document.getElementById('boardWrap').innerHTML = `
    <div class="board">
      ${col('🟡', 'รอดำเนินการ', '#f59e0b', w, 'waiting')}
      ${col('🔵', 'สั่งแล้ว รอของ', '#3b82f6', o, 'ordered')}
      ${colDone(d)}
    </div>`;

  document.querySelectorAll('.card').forEach(c =>
    c.addEventListener('click', () => openModal(c.dataset.id)));
  document.getElementById('doneToggle')?.addEventListener('click', () => {
    showDone = !showDone;
    document.getElementById('doneBody').classList.toggle('hidden', !showDone);
    document.getElementById('doneToggle').textContent = showDone ? 'ซ่อน' : 'แสดง';
  });
}

const dotMap = {
  '🟡 รอดำเนินการ':   '#f59e0b',
  '🔵 สั่งแล้ว รอของ': '#3b82f6',
  '✅ ของมาแล้ว':     '#22c55e',
  '❌ ยกเลิก':        '#ef4444',
};

function col(icon, label, color, orders, type) {
  return `
    <div class="column">
      <div class="col-header">
        <span class="col-stripe" style="background:${color}"></span>
        <span class="col-title">${label}</span>
        <span class="col-count">${orders.length}</span>
      </div>
      <div class="col-body">
        ${orders.length === 0
          ? `<div class="col-empty"><div class="col-empty-icon">📭</div><div class="col-empty-text">ไม่มีรายการ</div></div>`
          : orders.map(o => card(o, type)).join('')}
      </div>
    </div>`;
}

function colDone(orders) {
  return `
    <div class="column">
      <div class="col-header">
        <span class="col-stripe" style="background:#22c55e"></span>
        <span class="col-title">ของมาแล้ว</span>
        <span class="col-count">${orders.length}</span>
        <button class="col-toggle" id="doneToggle">${showDone ? 'ซ่อน' : 'แสดง'}</button>
      </div>
      <div class="col-body ${showDone ? '' : 'hidden'}" id="doneBody">
        ${orders.length === 0
          ? `<div class="col-empty"><div class="col-empty-icon">✅</div><div class="col-empty-text">ไม่มีรายการ</div></div>`
          : orders.map(o => card(o, 'done')).join('')}
      </div>
    </div>`;
}

function card(o, type) {
  const avatar = o.name.charAt(0).toUpperCase();
  const items  = o.items.slice(0,3).map(i => `
    <div class="card-item">
      <span class="item-dot" style="background:${dotMap[i.status]||'#ccc'}"></span>
      <span class="item-name">${i.product}</span>
      <span class="item-qty">${i.qty} ${i.unit}</span>
    </div>`).join('');
  const more = o.items.length > 3
    ? `<div class="card-more">+${o.items.length-3} รายการเพิ่มเติม</div>` : '';
  return `
    <div class="card ${type}" data-id="${o.orderId}">
      <div class="card-head">
        <div class="card-person">
          <div class="card-avatar">${avatar}</div>
          <div>
            <div class="card-name">${o.name}</div>
            <div class="card-dept">${o.dept}</div>
          </div>
        </div>
        <span class="dept-tag">${o.dept}</span>
      </div>
      <div class="card-items">${items}${more}</div>
      <div class="card-foot">
        <span class="card-date">📅 ${fmtDate(o.date)}</span>
        <span class="card-id">#${o.orderId.slice(-6)}</span>
      </div>
    </div>`;
}

// ── Modal ──
function openModal(orderId) {
  const all = [...(allData.waiting||[]),...(allData.ordered||[]),
               ...(allData.done||[]),...(allData.cancelled||[])];
  curOrder = all.find(o => o.orderId === orderId);
  if (!curOrder) return;

  document.getElementById('mTitle').textContent = `ออเดอร์ #${curOrder.orderId.slice(-8)}`;
  document.getElementById('mSub').textContent   = `${curOrder.name} · ${curOrder.dept} · ${fmtDate(curOrder.date)}`;

  document.getElementById('mBody').innerHTML = `
    <div class="info-grid">
      <div class="info-card">
        <div class="info-card-label">ผู้สั่ง</div>
        <div class="info-card-val">${curOrder.name}</div>
      </div>
      <div class="info-card">
        <div class="info-card-label">แผนก</div>
        <div class="info-card-val">${curOrder.dept}</div>
      </div>
    </div>
    <div class="section-title">รายการสินค้า</div>
    <div id="itemList">
      ${curOrder.items.map((item, i) => `
        <div class="item-row">
          <div class="item-row-num">${i+1}</div>
          <div class="item-row-info">
            <div class="item-row-name">${item.product}</div>
            ${item.note ? `<div class="item-row-note">${item.note}</div>` : ''}
          </div>
          <div class="item-row-qty">${item.qty} ${item.unit}</div>
          <select class="item-row-sel" data-idx="${i}">
            ${['🟡 รอดำเนินการ','🔵 สั่งแล้ว รอของ','✅ ของมาแล้ว','❌ ยกเลิก']
              .map(s => `<option ${s===item.status?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>`).join('')}
    </div>
    <div class="admin-field">
      <label class="admin-label">ผู้อัปเดต (ชื่อ Admin)</label>
      <input class="admin-input" id="adminName" type="text" placeholder="เช่น เกวลี (ออย)">
    </div>`;

  document.getElementById('overlay').classList.add('open');
}

// ── Save ──
document.getElementById('mSave').addEventListener('click', async () => {
  if (!curOrder) return;
  const btn = document.getElementById('mSave');
  const adminName = document.getElementById('adminName').value.trim();
  btn.disabled = true; btn.textContent = 'กำลังบันทึก…';

  const sels = document.querySelectorAll('.item-row-sel');
  let changed = 0;
  try {
    for (const sel of sels) {
      const idx    = parseInt(sel.dataset.idx);
      const status = sel.value;
      if (status === curOrder.items[idx].status) continue;
      const r = await fetch(SCRIPT_URL, {
        method:'POST',
        body: JSON.stringify({ action:'updateStatus', orderId:curOrder.orderId,
                               itemIndex:idx, status, updatedBy:adminName }),
      });
      const j = await r.json();
      if (!j.success) throw new Error(j.data);
      changed++;
    }
    toast(changed ? `✅ บันทึก ${changed} รายการแล้ว` : 'ℹ️ ไม่มีรายการที่เปลี่ยน');
    closeModal();
    await load();
  } catch(e) {
    toast('❌ บันทึกไม่สำเร็จ');
  } finally {
    btn.disabled = false; btn.innerHTML = '💾 บันทึกสถานะ';
  }
});

// ── Close modal ──
function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  curOrder = null;
}
document.getElementById('mClose').addEventListener('click', closeModal);
document.getElementById('mCancel').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeModal();
});

// ── Toast ──
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Listeners ──
document.getElementById('searchInput').addEventListener('input', e => {
  searchQ = e.target.value.trim(); render();
});
document.getElementById('deptFilter').addEventListener('change', e => {
  deptQ = e.target.value; load();
});
document.getElementById('refreshBtn').addEventListener('click', load);

// ── Helpers ──
function fmtDate(str) {
  if (!str) return '—';
  try {
    const d = str.includes('GMT') ? new Date(str) : (() => {
      const [dmy] = str.split(' ');
      const [d,m,y] = dmy.split('/').map(Number);
      return new Date(y > 2500 ? y-543 : y, m-1, d);
    })();
    return d.toLocaleDateString('th-TH', { day:'numeric', month:'short' });
  } catch { return str.split(' ')[0]; }
}

load();
</script>
</body>
</html>
