<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>จัดการรายชื่อพนักงาน — บีพราวด์ คลินิก</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy:  #055367;
  --teal:  #1F7A95;
  --gold:  #C2822B;
  --cream: #F4F4E8;
  --white: #FFFFFF;
  --gray1: #F7F8FA;
  --gray2: #E8ECF0;
  --gray3: #B0B8C4;
  --text:  #1A2530;
  --text2: #4A5568;
  --green: #1A7A4A; --green-bg: #D1FAE5;
  --red:   #991B1B; --red-bg:   #FEE2E2;
  --radius: 12px;
  --shadow: 0 4px 24px rgba(5,83,103,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans Thai', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; }

/* TOPBAR */
.topbar {
  background: var(--navy); padding: 0;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 16px rgba(5,83,103,0.25);
}
.topbar-inner {
  max-width: 720px; margin: 0 auto; padding: 14px 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.topbar-logo { font-size: 20px; }
.topbar-title h1 { font-size: 15px; font-weight: 700; color: white; }
.topbar-title p  { font-size: 11px; color: rgba(255,255,255,0.6); }
.badge { background: var(--gold); color: white; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }

/* CONTAINER */
.container { max-width: 720px; margin: 0 auto; padding: 20px 16px; }

/* ADD FORM */
.add-card {
  background: white; border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow); margin-bottom: 20px;
}
.add-card h2 { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 14px; }
.form-row { display: flex; gap: 10px; flex-wrap: wrap; }
.form-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 140px; }
.form-group label { font-size: 12px; font-weight: 600; color: var(--text2); }
.form-group input, .form-group select {
  padding: 9px 12px; border: 1.5px solid var(--gray2); border-radius: 8px;
  font-size: 14px; font-family: inherit; outline: none; background: white;
}
.form-group input:focus, .form-group select:focus { border-color: var(--teal); }
.btn-add {
  background: var(--navy); color: white; border: none;
  padding: 9px 20px; border-radius: 8px; font-size: 14px; font-weight: 700;
  font-family: inherit; cursor: pointer; white-space: nowrap; align-self: flex-end;
}
.btn-add:hover { background: var(--teal); }
.btn-add:disabled { background: var(--gray3); cursor: not-allowed; }

/* FILTER */
.filter-row {
  display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center;
}
.filter-row select, .filter-row input {
  padding: 8px 12px; border: 1.5px solid var(--gray2); border-radius: 8px;
  font-size: 13px; font-family: inherit; outline: none; background: white;
}
.filter-row input { flex: 1; min-width: 140px; }

/* STAFF LIST */
.staff-wrap { background: white; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.staff-header {
  padding: 14px 18px; border-bottom: 1px solid var(--gray2);
  display: flex; align-items: center; justify-content: space-between;
}
.staff-header h2 { font-size: 14px; font-weight: 700; color: var(--navy); }
.count-text { font-size: 13px; color: var(--text2); }

.staff-item {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 18px; border-bottom: 1px solid var(--gray2);
  transition: background 0.15s;
}
.staff-item:last-child { border-bottom: none; }
.staff-item:hover { background: var(--gray1); }

.staff-avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: linear-gradient(135deg, var(--teal), var(--navy));
  color: white; font-size: 14px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.staff-info { flex: 1; }
.staff-name { font-size: 14px; font-weight: 600; color: var(--text); }
.staff-dept { font-size: 12px; color: var(--text2); margin-top: 2px; }
.dept-badge {
  display: inline-block; padding: 2px 8px; border-radius: 20px;
  font-size: 11px; font-weight: 600;
  background: rgba(5,83,103,0.1); color: var(--navy);
}
.btn-remove {
  background: none; border: 1.5px solid var(--gray2); color: var(--gray3);
  padding: 5px 12px; border-radius: 8px; font-size: 12px;
  cursor: pointer; font-family: inherit; transition: all 0.15s;
  white-space: nowrap;
}
.btn-remove:hover { border-color: var(--red); color: var(--red); background: var(--red-bg); }

/* TOAST */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--navy); color: white; padding: 12px 24px; border-radius: 100px;
  font-size: 14px; font-weight: 600; z-index: 999; transition: transform 0.3s ease;
  white-space: nowrap; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { background: var(--green); }
.toast.error   { background: var(--red); }

/* LOADING */
.loading-row { text-align: center; padding: 40px; color: var(--gray3); font-size: 14px; }
.spinner-sm {
  display: inline-block; width: 18px; height: 18px;
  border: 2px solid var(--gray2); border-top-color: var(--teal);
  border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty-state { text-align: center; padding: 48px 20px; color: var(--gray3); }
.empty-state .icon { font-size: 36px; margin-bottom: 10px; }
.empty-state p { font-size: 14px; }

/* CONFIRM MODAL */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.45); z-index: 200;
  align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: white; border-radius: 16px; padding: 28px 24px;
  width: 100%; max-width: 360px; text-align: center;
}
.modal h3 { font-size: 16px; font-weight: 700; color: var(--navy); margin-bottom: 8px; }
.modal p  { font-size: 14px; color: var(--text2); margin-bottom: 20px; line-height: 1.6; }
.modal-btns { display: flex; gap: 10px; }
.btn-cancel { flex: 1; padding: 10px; border: 1.5px solid var(--gray2); background: white; border-radius: 8px; font-size: 14px; font-family: inherit; cursor: pointer; }
.btn-confirm { flex: 1; padding: 10px; background: var(--red); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="topbar-left">
      <div class="topbar-logo">💎</div>
      <div class="topbar-title">
        <h1>จัดการรายชื่อพนักงาน</h1>
        <p>บีพราวด์ คลินิก — ระบบสั่งของ</p>
      </div>
    </div>
    <span class="badge" id="badge-count">...</span>
  </div>
</div>

<div class="container">

  <!-- ADD FORM -->
  <div class="add-card">
    <h2>➕ เพิ่มพนักงานใหม่</h2>
    <div class="form-row">
      <div class="form-group">
        <label>ชื่อ-ชื่อเล่น</label>
        <input type="text" id="inp-name" placeholder="เช่น สมใจ (ใจ)" autocomplete="off">
      </div>
      <div class="form-group">
        <label>แผนก</label>
        <select id="inp-dept">
          <option value="">-- เลือกแผนก --</option>
          <option>ธุรการ</option>
          <option>ผู้ช่วย</option>
          <option>แม่บ้าน</option>
          <option>Marketing</option>
          <option>อื่นๆ</option>
        </select>
      </div>
      <button class="btn-add" id="btn-add" onclick="addStaff()">เพิ่ม</button>
    </div>
  </div>

  <!-- FILTER -->
  <div class="filter-row">
    <select id="filter-dept" onchange="renderList()">
      <option value="">ทุกแผนก</option>
      <option>ธุรการ</option>
      <option>ผู้ช่วย</option>
      <option>แม่บ้าน</option>
      <option>Marketing</option>
      <option>อื่นๆ</option>
    </select>
    <input type="text" id="filter-search" placeholder="🔍 ค้นหาชื่อ..." oninput="renderList()">
  </div>

  <!-- LIST -->
  <div class="staff-wrap">
    <div class="staff-header">
      <h2>👥 รายชื่อพนักงาน</h2>
      <span class="count-text" id="count-text">กำลังโหลด...</span>
    </div>
    <div id="staff-list">
      <div class="loading-row"><span class="spinner-sm"></span>กำลังโหลดรายชื่อ...</div>
    </div>
  </div>

</div>

<!-- CONFIRM MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3>⚠️ ยืนยันการลบ</h3>
    <p id="modal-msg">คุณต้องการปิดใช้งาน <strong id="modal-name"></strong> ใช่ไหม?<br>พนักงานจะไม่ปรากฏในระบบสั่งของ</p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
      <button class="btn-confirm" id="btn-confirm">ลบออก</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwTvJBKmKC56TBodSnoweS-SoVtjLA0hBswziH6vpNSnWCAyMmHO1dgAVnvN84Yhod8/exec';
let staffList = [];

// ── โหลดรายชื่อ ──
async function loadStaff() {
  try {
    const res  = await fetch(API + '?action=getNames');
    const html = await res.text();
    // follow redirect manually by parsing JSON from response
    const json = JSON.parse(html.match(/\{.*\}/s)?.[0] || html);
    staffList  = json?.data?.staff || [];
  } catch(e) {
    // ลอง -L (follow redirect)
    try {
      const res  = await fetch(API + '?action=getNames', { redirect: 'follow' });
      const json = await res.json();
      staffList  = json?.data?.staff || [];
    } catch(e2) {
      staffList = [];
    }
  }
  renderList();
}

// ── Render รายการ ──
function renderList() {
  const dept   = document.getElementById('filter-dept').value;
  const search = document.getElementById('filter-search').value.toLowerCase();

  let filtered = staffList.filter(s => {
    if (dept   && s.dept !== dept) return false;
    if (search && !s.name.toLowerCase().includes(search)) return false;
    return true;
  });

  document.getElementById('badge-count').textContent = staffList.length + ' คน';
  document.getElementById('count-text').textContent  = filtered.length + ' รายการ';

  const el = document.getElementById('staff-list');
  if (filtered.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="icon">👤</div><p>ไม่พบรายชื่อที่ตรงกัน</p></div>`;
    return;
  }

  el.innerHTML = filtered.map((s, i) => `
    <div class="staff-item">
      <div class="staff-avatar">${s.name.charAt(0)}</div>
      <div class="staff-info">
        <div class="staff-name">${s.name}</div>
        <div class="staff-dept"><span class="dept-badge">${s.dept}</span></div>
      </div>
      <button class="btn-remove" onclick="confirmRemove('${escHtml(s.name)}')">ลบออก</button>
    </div>
  `).join('');
}

// ── เพิ่มพนักงาน ──
async function addStaff() {
  const name = document.getElementById('inp-name').value.trim();
  const dept = document.getElementById('inp-dept').value;

  if (!name) { showToast('กรุณาใส่ชื่อพนักงาน', 'error'); return; }
  if (!dept) { showToast('กรุณาเลือกแผนก', 'error'); return; }

  const btn = document.getElementById('btn-add');
  btn.disabled = true;
  btn.textContent = '...';

  try {
    const res  = await fetch(API, {
      method: 'POST',
      body: JSON.stringify({ action: 'addEmployee', name, dept }),
    });
    const json = await res.json();

    if (json.success && json.data?.success !== false) {
      showToast(`✅ เพิ่ม ${name} เรียบร้อยแล้ว`, 'success');
      document.getElementById('inp-name').value = '';
      document.getElementById('inp-dept').value = '';
      await loadStaff();
    } else {
      showToast(json.data?.message || 'เกิดข้อผิดพลาด', 'error');
    }
  } catch(e) {
    showToast('เชื่อมต่อไม่ได้ กรุณาลองใหม่', 'error');
  }

  btn.disabled = false;
  btn.textContent = 'เพิ่ม';
}

// ── ยืนยันลบ ──
let pendingRemove = null;
function confirmRemove(name) {
  pendingRemove = name;
  document.getElementById('modal-name').textContent = name;
  document.getElementById('modal-overlay').classList.add('show');
  document.getElementById('btn-confirm').onclick = doRemove;
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
  pendingRemove = null;
}

// ── ลบพนักงาน ──
async function doRemove() {
  if (!pendingRemove) return;
  const name = pendingRemove;
  closeModal();

  try {
    const res  = await fetch(API, {
      method: 'POST',
      body: JSON.stringify({ action: 'removeEmployee', name }),
    });
    const json = await res.json();

    if (json.success && json.data?.success !== false) {
      showToast(`🗑 ปิดใช้งาน ${name} แล้ว`, 'success');
      await loadStaff();
    } else {
      showToast(json.data?.message || 'เกิดข้อผิดพลาด', 'error');
    }
  } catch(e) {
    showToast('เชื่อมต่อไม่ได้ กรุณาลองใหม่', 'error');
  }
}

// ── Toast ──
let toastTimer;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 3000);
}

function escHtml(str) {
  return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

// ── Enter key ──
document.getElementById('inp-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') addStaff();
});

// ── ปิด Modal คลิก outside ──
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// ── Init ──
loadStaff();
</script>
</body>
</html>
