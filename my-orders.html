<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BeProud — ออเดอร์ของฉัน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#055367;--teal:#1F7A95;--teal2:#e6f4f8;
  --bg:#f0f2f5;--surface:#fff;--border:#e4e8ed;
  --text:#1a2030;--sub:#6b7585;--hint:#adb5c0;
  --y-bg:#fff8e6;--y-dot:#f59e0b;--y-text:#7c4a00;
  --b-bg:#e8f3ff;--b-dot:#3b82f6;--b-text:#1a4a80;
  --g-bg:#e8faf0;--g-dot:#22c55e;--g-text:#0d4f2a;
  --r-bg:#fff0f0;--r-dot:#ef4444;--r-text:#7a1a1a;
  --r:12px;--r-sm:8px;
  --sh:0 1px 4px rgba(0,0,0,.07);--sh2:0 4px 16px rgba(0,0,0,.10);--t:.18s ease;
}
[data-dark]{
  --bg:#10131a;--surface:#181d27;--border:#262d3a;
  --text:#e8ecf2;--sub:#8892a4;--hint:#444e60;--teal2:#0d2535;
  --y-bg:#261c04;--y-text:#fcd34d;
  --b-bg:#071830;--b-text:#93c5fd;
  --g-bg:#041a0e;--g-text:#86efac;
  --r-bg:#1a0404;--r-text:#fca5a5;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Sarabun',-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;font-size:15px;line-height:1.55;
  transition:background var(--t),color var(--t);
  -webkit-font-smoothing:antialiased;
}
a{text-decoration:none;color:inherit;}
button,select,input{font-family:inherit;font-size:inherit;}

.hdr{
  position:sticky;top:0;z-index:100;height:54px;
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:10px;
  box-shadow:var(--sh);
}
.logo{
  width:32px;height:32px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(140deg,var(--navy),var(--teal));
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;
}
.brand-name{font-size:14px;font-weight:700;color:var(--navy);}
[data-dark] .brand-name{color:var(--teal);}
.brand-sub{font-size:10px;color:var(--sub);}
.hdr-nav{margin-left:auto;display:flex;align-items:center;gap:4px;}
.nav-a{
  padding:6px 10px;border-radius:var(--r-sm);
  font-size:12px;font-weight:500;color:var(--sub);
  display:flex;align-items:center;gap:4px;white-space:nowrap;
  transition:background var(--t),color var(--t);
}
.nav-a:hover{background:var(--bg);color:var(--text);}
.nav-a.on{background:var(--teal2);color:var(--teal);}
.icn-btn{
  width:34px;height:34px;border-radius:var(--r-sm);
  background:var(--bg);border:1px solid var(--border);
  color:var(--sub);cursor:pointer;font-size:15px;
  display:grid;place-items:center;transition:background var(--t);
}
.icn-btn:hover{background:var(--border);}

/* PICKER */
.picker-sec{padding:16px 16px 0;max-width:560px;margin:0 auto;}
.picker-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);
}
.picker-title{font-size:15px;font-weight:700;margin-bottom:4px;}
.picker-desc{font-size:13px;color:var(--sub);margin-bottom:14px;}
.select-wrap{position:relative;}
.select-wrap select{
  width:100%;padding:11px 36px 11px 14px;
  border:1.5px solid var(--border);border-radius:var(--r-sm);
  background:var(--bg);color:var(--text);font-size:14px;
  outline:none;font-family:inherit;appearance:none;-webkit-appearance:none;
  transition:border-color var(--t),box-shadow var(--t);
}
.select-wrap select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(31,122,149,.1);}
.select-wrap::after{
  content:'▾';position:absolute;right:12px;top:50%;transform:translateY(-50%);
  color:var(--sub);pointer-events:none;
}

/* ACTIVE ORDERS SUMMARY */
.active-summary{
  max-width:560px;margin:12px auto 0;padding:0 16px;
}
.summary-row{
  display:flex;gap:8px;margin-bottom:12px;
}
.sum-card{
  flex:1;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:12px;text-align:center;box-shadow:var(--sh);
}
.sum-num{font-size:22px;font-weight:700;}
.sum-lbl{font-size:11px;color:var(--sub);margin-top:2px;}

/* ORDERS LIST */
.orders-sec{max-width:560px;margin:0 auto;padding:0 16px 100px;}
.sec-hd{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;padding-top:4px;
}
.sec-title{font-size:14px;font-weight:700;}
.sec-count{font-size:12px;color:var(--sub);}

/* ORDER CARD */
.ocard{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);margin-bottom:10px;overflow:hidden;
  box-shadow:var(--sh);transition:box-shadow var(--t);
}
.ocard:hover{box-shadow:var(--sh2);}
.ocard-hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 14px;border-bottom:1px solid var(--border);gap:8px;
}
.ocard-id{font-size:11px;font-family:monospace;color:var(--sub);}
.ocard-date{font-size:11px;color:var(--hint);}
.badge{
  font-size:10px;font-weight:700;
  padding:3px 9px;border-radius:20px;white-space:nowrap;
}
.badge-y{background:var(--y-bg);color:var(--y-text);}
.badge-b{background:var(--b-bg);color:var(--b-text);}
.badge-g{background:var(--g-bg);color:var(--g-text);}
.badge-r{background:var(--r-bg);color:var(--r-text);}

.ocard-items{padding:8px 14px;}
.oitem{
  display:flex;align-items:center;gap:8px;
  padding:6px 0;border-bottom:1px solid var(--border);
}
.oitem:last-child{border-bottom:none;}
.odot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.oname{flex:1;font-size:13px;}
.oqty{font-size:12px;color:var(--sub);white-space:nowrap;}
.oconfirmed{font-size:11px;color:var(--g-text);display:flex;align-items:center;gap:3px;}

.confirm-bar{
  padding:10px 14px;border-top:1px solid var(--border);
  background:var(--g-bg);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.confirm-bar.hidden{display:none;}
.confirm-msg{font-size:12px;color:var(--g-text);}
.cbtn{
  padding:7px 14px;border-radius:var(--r-sm);
  background:var(--g-dot);color:#fff;
  font-size:12px;font-weight:700;border:none;cursor:pointer;
  box-shadow:0 2px 6px rgba(34,197,94,.28);
  transition:opacity var(--t),transform var(--t);
  display:flex;align-items:center;gap:5px;white-space:nowrap;
}
.cbtn:hover{opacity:.88;transform:translateY(-1px);}
.cbtn:disabled{opacity:.45;cursor:not-allowed;transform:none;}

/* EMPTY / LOADING */
.empty{text-align:center;padding:40px 20px;color:var(--hint);}
.empty-ic{font-size:36px;margin-bottom:8px;}
.empty-tx{font-size:14px;font-weight:500;}
.empty-sub{font-size:12px;margin-top:4px;}
.ld{display:flex;flex-direction:column;align-items:center;gap:10px;padding:48px 20px;color:var(--sub);font-size:13px;}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--teal);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.toast{
  position:fixed;bottom:80px;left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--text);color:var(--surface);
  padding:10px 18px;border-radius:24px;font-size:13px;font-weight:500;
  box-shadow:0 4px 18px rgba(0,0,0,.22);
  z-index:400;opacity:0;transition:opacity .2s,transform .2s;
  pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.bot-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--surface);border-top:1px solid var(--border);
  padding:0 8px env(safe-area-inset-bottom);
  z-index:150;box-shadow:0 -2px 10px rgba(0,0,0,.07);
}
.bot-nav-inner{display:flex;justify-content:space-around;}
.bnav-a{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 12px;font-size:10px;font-weight:500;color:var(--sub);
  text-decoration:none;
}
.bnav-a.on{color:var(--teal);}
.bnav-ic{font-size:20px;line-height:1;}

@media(min-width:621px){.bot-nav{display:none;}.orders-sec,.picker-sec,.active-summary{padding-bottom:32px;}}
</style>
</head>
<body>

<header class="hdr">
  <div class="logo">BP</div>
  <div>
    <div class="brand-name">BeProud Clinic</div>
    <div class="brand-sub">ออเดอร์ของฉัน</div>
  </div>
  <nav class="hdr-nav">
    <a href="dashboard.html" class="nav-a">📋 ออเดอร์</a>
    <a href="my-orders.html" class="nav-a on">👤 ของฉัน</a>
    <a href="history.html"   class="nav-a">🗂 ประวัติ</a>
  </nav>
  <button class="icn-btn" id="themeBtn">🌙</button>
</header>

<!-- PICKER -->
<div class="picker-sec">
  <div class="picker-card">
    <div class="picker-title">👤 เลือกชื่อของคุณ</div>
    <div class="picker-desc">ดูสถานะออเดอร์และยืนยันรับของได้ที่นี่</div>
    <div class="select-wrap">
      <select id="nameSel" onchange="onSelect(this.value)">
        <option value="">⏳ กำลังโหลดรายชื่อ…</option>
      </select>
    </div>
  </div>
</div>

<!-- ACTIVE SUMMARY -->
<div class="active-summary" id="summaryWrap" style="display:none">
  <div class="summary-row">
    <div class="sum-card">
      <div class="sum-num" style="color:var(--y-dot)" id="sumWaiting">0</div>
      <div class="sum-lbl">รอดำเนินการ</div>
    </div>
    <div class="sum-card">
      <div class="sum-num" style="color:var(--b-dot)" id="sumOrdered">0</div>
      <div class="sum-lbl">สั่งแล้ว รอของ</div>
    </div>
    <div class="sum-card">
      <div class="sum-num" style="color:var(--g-dot)" id="sumConfirm">0</div>
      <div class="sum-lbl">รอยืนยันรับ</div>
    </div>
  </div>
</div>

<!-- ORDERS -->
<div class="orders-sec" id="ordersWrap"></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- BOTTOM NAV -->
<nav class="bot-nav">
  <div class="bot-nav-inner">
    <a href="dashboard.html" class="bnav-a"><span class="bnav-ic">📋</span>ออเดอร์</a>
    <a href="my-orders.html" class="bnav-a on"><span class="bnav-ic">👤</span>ของฉัน</a>
    <a href="Stock_Check.html" class="bnav-a"><span class="bnav-ic">➕</span>สั่งของ</a>
    <a href="history.html"   class="bnav-a"><span class="bnav-ic">🗂</span>ประวัติ</a>
  </div>
</nav>

<script>
const URL_ = 'https://script.google.com/macros/s/AKfycbwTvJBKmKC56TBodSnoweS-SoVtjLA0hBswziH6vpNSnWCAyMmHO1dgAVnvN84Yhod8/exec';
const DOTS = {'🟡 รอดำเนินการ':'#f59e0b','🔵 สั่งแล้ว รอของ':'#3b82f6','✅ ของมาแล้ว':'#22c55e','❌ ยกเลิก':'#ef4444'};

let dark = localStorage.getItem('bp-dk') === '1';
let allOrders = [];
let selName = '';

function applyTheme(){
  document.body.toggleAttribute('data-dark', dark);
  document.getElementById('themeBtn').textContent = dark ? '☀️' : '🌙';
  localStorage.setItem('bp-dk', dark ? '1' : '0');
}
applyTheme();
document.getElementById('themeBtn').onclick = () => { dark = !dark; applyTheme(); };

// ── Load staff dropdown ───────────────────────────────
async function loadStaff() {
  try {
    const r = await fetch(`${URL_}?action=getNames`);
    const j = await r.json();
    if (!j.success) throw new Error();
    const staff = j.data.staff || [];
    const sel = document.getElementById('nameSel');
    sel.innerHTML = `<option value="">— เลือกชื่อของคุณ —</option>` +
      staff.map(s => `<option value="${s.name}">${s.name}</option>`).join('');

    // auto-select จาก localStorage
    const last = localStorage.getItem('bp-myname');
    if (last && staff.find(s => s.name === last)) {
      sel.value = last;
      onSelect(last);
    }
    // auto-select จาก URL param
    const urlName = new URLSearchParams(location.search).get('name');
    if (urlName) { sel.value = urlName; onSelect(urlName); }
  } catch {
    document.getElementById('nameSel').innerHTML = '<option>โหลดไม่ได้ กรุณา refresh</option>';
  }
}

async function onSelect(name) {
  selName = name;
  if (!name) {
    document.getElementById('summaryWrap').style.display = 'none';
    document.getElementById('ordersWrap').innerHTML = '';
    return;
  }
  localStorage.setItem('bp-myname', name);
  document.getElementById('ordersWrap').innerHTML = '<div class="ld"><div class="spin"></div>กำลังโหลด…</div>';
  document.getElementById('summaryWrap').style.display = 'none';

  try {
    const p = new URLSearchParams({ action:'getOrders', name });
    const r = await fetch(`${URL_}?${p}`);
    const j = await r.json();
    if (!j.success) throw new Error(j.data);

    // รวมทุก order ของคนนี้ เฉพาะ active
    const all = [
      ...(j.data.waiting||[]),
      ...(j.data.ordered||[]),
      ...(j.data.done||[]),
    ].filter(o => o.name.toLowerCase().includes(name.toLowerCase()));

    // เฉพาะ order ที่ยังค้าง (มี item รอดำเนินการ หรือ สั่งแล้ว หรือ รอยืนยัน)
    allOrders = all.filter(o =>
      o.items.some(i =>
        i.status === '🟡 รอดำเนินการ' ||
        i.status === '🔵 สั่งแล้ว รอของ' ||
        (i.status === '✅ ของมาแล้ว' && !i.confirmedAt)
      )
    );
    allOrders.sort((a,b) => b.orderId.localeCompare(a.orderId));

    updateSummary();
    renderOrders();
  } catch(e) {
    document.getElementById('ordersWrap').innerHTML =
      `<div class="empty"><div class="empty-ic">⚠️</div><div class="empty-tx">โหลดไม่ได้</div><div class="empty-sub">${e.message}</div></div>`;
  }
}

function updateSummary() {
  let w=0, o=0, c=0;
  allOrders.forEach(order => {
    order.items.forEach(i => {
      if (i.status==='🟡 รอดำเนินการ') w++;
      else if (i.status==='🔵 สั่งแล้ว รอของ') o++;
      else if (i.status==='✅ ของมาแล้ว' && !i.confirmedAt) c++;
    });
  });
  document.getElementById('sumWaiting').textContent = w;
  document.getElementById('sumOrdered').textContent = o;
  document.getElementById('sumConfirm').textContent = c;
  document.getElementById('summaryWrap').style.display = (w+o+c>0) ? '' : 'none';
}

function renderOrders() {
  const wrap = document.getElementById('ordersWrap');
  if (!allOrders.length) {
    wrap.innerHTML = `
      <div class="empty">
        <div class="empty-ic">🎉</div>
        <div class="empty-tx">ไม่มีออเดอร์ค้างอยู่</div>
        <div class="empty-sub">ออเดอร์ทั้งหมดเสร็จสิ้นแล้วค่ะ</div>
      </div>`;
    return;
  }

  wrap.innerHTML = `
    <div class="sec-hd">
      <span class="sec-title">📦 ออเดอร์ที่ยังค้างอยู่</span>
      <span class="sec-count">${allOrders.length} ออเดอร์</span>
    </div>
    ${allOrders.map(o => orderCard(o)).join('')}`;

  // bind confirm buttons
  document.querySelectorAll('.cbtn').forEach(btn => {
    btn.addEventListener('click', () =>
      confirmItem(btn.dataset.orderId, +btn.dataset.idx, btn.dataset.name, btn)
    );
  });

  // scroll to highlighted order
  const urlOrderId = new URLSearchParams(location.search).get('orderId');
  if (urlOrderId) {
    setTimeout(() => {
      document.getElementById(`oc-${urlOrderId}`)
        ?.scrollIntoView({behavior:'smooth', block:'center'});
    }, 300);
  }
}

function orderCard(o) {
  const urlOrderId = new URLSearchParams(location.search).get('orderId');
  const isHL = o.orderId === urlOrderId;

  // badge
  const hasW = o.items.some(i => i.status==='🟡 รอดำเนินการ');
  const hasO = o.items.some(i => i.status==='🔵 สั่งแล้ว รอของ');
  const hasDone = o.items.some(i => i.status==='✅ ของมาแล้ว' && !i.confirmedAt);
  let bc='badge-b', bt='🔵 สั่งแล้ว รอของ';
  if (hasW) { bc='badge-y'; bt='🟡 รอดำเนินการ'; }
  else if (hasDone && !hasO) { bc='badge-g'; bt='✅ รอยืนยันรับ'; }

  const needConfirm = o.items.filter(i => i.status==='✅ ของมาแล้ว' && !i.confirmedAt);

  const itemsHtml = o.items
    .filter(i => i.status!=='❌ ยกเลิก')
    .map((it, idx) => {
      const dot = DOTS[it.status] || '#ccc';
      const needC = it.status==='✅ ของมาแล้ว' && !it.confirmedAt;
      const didC  = it.status==='✅ ของมาแล้ว' && it.confirmedAt;
      return `
        <div class="oitem">
          <span class="odot" style="background:${dot}"></span>
          <span class="oname">${it.product}</span>
          <span class="oqty">${it.qty} ${it.unit}</span>
          ${needC ? `<button class="cbtn" data-order-id="${o.orderId}" data-idx="${idx}" data-name="${o.name}">✅ รับแล้ว</button>` : ''}
          ${didC  ? `<span class="oconfirmed">✅ รับแล้ว</span>` : ''}
        </div>`;
    }).join('');

  return `
    <div class="ocard${isHL?' highlight':''}" id="oc-${o.orderId}">
      <div class="ocard-hd">
        <div>
          <div class="ocard-id">#${o.orderId.slice(-8)}</div>
          <div class="ocard-date">📅 ${fmt(o.date)}</div>
        </div>
        <span class="badge ${bc}">${bt}</span>
      </div>
      <div class="ocard-items">${itemsHtml}</div>
      ${needConfirm.length > 0 ? `
        <div class="confirm-bar" id="cbar-${o.orderId}">
          <span class="confirm-msg">📦 ของมาแล้ว ${needConfirm.length} รายการ กดยืนยันรับด้านบนนะคะ</span>
        </div>` : ''}
    </div>`;
}

async function confirmItem(orderId, itemIndex, name, btn) {
  btn.disabled = true; btn.textContent = '⏳';
  try {
    const r = await fetch(URL_, {
      method:'POST',
      body: JSON.stringify({ action:'confirmReceipt', orderId, itemIndex, confirmedBy:name }),
    });
    const j = await r.json();
    if (!j.success && j.data?.message) { toast('ℹ️ ' + j.data.message); btn.disabled=false; btn.innerHTML='✅ รับแล้ว'; return; }
    if (!j.success) throw new Error(j.data);

    btn.outerHTML = `<span class="oconfirmed">✅ รับแล้ว</span>`;
    toast('✅ ยืนยันรับของเรียบร้อยแล้วค่ะ!');

    // reload เพื่ออัปเดต summary
    setTimeout(() => onSelect(selName), 800);
  } catch { toast('❌ ยืนยันไม่สำเร็จ'); btn.disabled=false; btn.innerHTML='✅ รับแล้ว'; }
}

function fmt(s) {
  if (!s) return '—';
  try {
    const d = s.includes('GMT') ? new Date(s) : (() => {
      const [dm] = s.split(' '); const [dd,mm,yy] = dm.split('/').map(Number);
      return new Date(yy>2500?yy-543:yy, mm-1, dd);
    })();
    return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'});
  } catch { return s.split(' ')[0]; }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

loadStaff();
</script>
</body>
</html>
