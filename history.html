<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BeProud — ประวัติออเดอร์</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#055367;--teal:#1F7A95;--teal2:#e6f4f8;--gold:#C2822B;
  --bg:#f0f2f5;--surface:#fff;--border:#e4e8ed;--border2:#d0d7e0;
  --text:#1a2030;--sub:#6b7585;--hint:#adb5c0;
  --y-bg:#fff8e6;--y-dot:#f59e0b;--y-text:#7c4a00;
  --b-bg:#e8f3ff;--b-dot:#3b82f6;--b-text:#1a4a80;
  --g-bg:#e8faf0;--g-dot:#22c55e;--g-text:#0d4f2a;
  --r-bg:#fff0f0;--r-dot:#ef4444;--r-text:#7a1a1a;
  --r:12px;--r-sm:8px;
  --sh:0 1px 4px rgba(0,0,0,.07);--sh2:0 4px 16px rgba(0,0,0,.10);--t:.18s ease;
}
[data-dark]{
  --bg:#10131a;--surface:#181d27;--border:#262d3a;--border2:#323a47;
  --text:#e8ecf2;--sub:#8892a4;--hint:#444e60;--teal2:#0d2535;
  --y-bg:#261c04;--y-text:#fcd34d;
  --b-bg:#071830;--b-text:#93c5fd;
  --g-bg:#041a0e;--g-text:#86efac;
  --r-bg:#1a0404;--r-text:#fca5a5;
  --sh:0 1px 4px rgba(0,0,0,.3);--sh2:0 4px 16px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Sarabun',-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;font-size:15px;line-height:1.55;
  transition:background var(--t),color var(--t);
  -webkit-font-smoothing:antialiased;
}
a{text-decoration:none;color:inherit;}
button,select,input{font-family:inherit;font-size:inherit;}

/* HEADER */
.hdr{
  position:sticky;top:0;z-index:100;height:54px;
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:10px;
  box-shadow:var(--sh);
}
.logo{
  width:32px;height:32px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(140deg,var(--navy),var(--teal));
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;
  box-shadow:0 2px 6px rgba(5,83,103,.25);
}
.brand{flex:1;}
.brand-name{font-size:14px;font-weight:700;color:var(--navy);}
[data-dark] .brand-name{color:var(--teal);}
.brand-sub{font-size:10px;color:var(--sub);}
.hdr-nav{display:flex;align-items:center;gap:4px;}
.nav-a{
  padding:6px 10px;border-radius:var(--r-sm);
  font-size:12px;font-weight:500;color:var(--sub);
  display:flex;align-items:center;gap:4px;white-space:nowrap;
  transition:background var(--t),color var(--t);
}
.nav-a:hover{background:var(--bg);color:var(--text);}
.nav-a.on{background:var(--teal2);color:var(--teal);}
.icn-btn{
  width:34px;height:34px;border-radius:var(--r-sm);
  background:var(--bg);border:1px solid var(--border);
  color:var(--sub);cursor:pointer;font-size:15px;
  display:grid;place-items:center;transition:background var(--t),transform var(--t);
}
.icn-btn:hover{background:var(--border);}
.icn-btn:active{transform:scale(.9);}

/* FILTER PANEL */
.filter-panel{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:12px 16px;
}
.filter-row1{display:flex;gap:8px;margin-bottom:8px;}
.search-wrap{position:relative;flex:1;}
.search-wrap input{
  width:100%;padding:8px 10px 8px 32px;
  border:1.5px solid var(--border2);border-radius:var(--r-sm);
  background:var(--bg);color:var(--text);font-size:13px;outline:none;
  transition:border-color var(--t),box-shadow var(--t);
}
.search-wrap input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(31,122,149,.1);}
.search-wrap input::placeholder{color:var(--hint);}
.search-ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--hint);font-size:13px;pointer-events:none;}

.flt-select{
  padding:8px 10px;border:1.5px solid var(--border2);border-radius:var(--r-sm);
  background:var(--bg);color:var(--text);font-size:12px;outline:none;cursor:pointer;
  white-space:nowrap;max-width:100px;
  transition:border-color var(--t);
}
.flt-select:focus{border-color:var(--teal);}

.filter-row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.date-label{font-size:11px;color:var(--sub);font-weight:600;white-space:nowrap;}
.date-inp{
  padding:7px 10px;border:1.5px solid var(--border2);border-radius:var(--r-sm);
  background:var(--bg);color:var(--text);font-size:12px;outline:none;
  transition:border-color var(--t);flex:1;min-width:120px;max-width:150px;
}
.date-inp:focus{border-color:var(--teal);}
.filter-sep{color:var(--hint);font-size:12px;}

.btn-search{
  padding:8px 16px;border-radius:var(--r-sm);
  background:linear-gradient(135deg,var(--teal),var(--navy));
  color:#fff;font-size:12px;font-weight:600;border:none;cursor:pointer;
  white-space:nowrap;
  box-shadow:0 2px 6px rgba(31,122,149,.25);
  transition:opacity var(--t);
}
.btn-search:hover{opacity:.9;}
.btn-clear{
  padding:8px 12px;border-radius:var(--r-sm);
  background:var(--bg);color:var(--sub);border:1px solid var(--border2);
  font-size:12px;cursor:pointer;white-space:nowrap;
  transition:background var(--t);
}
.btn-clear:hover{background:var(--border);}

/* STATS STRIP */
.stats-strip{
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;overflow-x:auto;scrollbar-width:none;
}
.stats-strip::-webkit-scrollbar{display:none;}
.stat-item{
  display:flex;align-items:center;gap:8px;
  padding:10px 16px;border-right:1px solid var(--border);
  min-width:100px;flex-shrink:0;
}
.stat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.stat-num{font-size:17px;font-weight:700;}
.stat-lbl{font-size:10px;color:var(--sub);font-weight:500;}

/* RESULTS */
.results{max-width:600px;margin:0 auto;padding:14px 16px 100px;}
.res-hd{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.res-title{font-size:13px;font-weight:700;color:var(--sub);}
.res-count{font-size:12px;color:var(--hint);}

/* PAGE BUTTONS */
.pagination{display:flex;gap:6px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
.pg-btn{
  padding:6px 12px;border-radius:var(--r-sm);
  background:var(--surface);border:1px solid var(--border);
  font-size:12px;font-weight:600;color:var(--sub);cursor:pointer;
  transition:background var(--t),color var(--t);
}
.pg-btn:hover{background:var(--teal2);color:var(--teal);}
.pg-btn.on{background:var(--teal);color:#fff;border-color:var(--teal);}
.pg-btn:disabled{opacity:.4;cursor:not-allowed;}

/* ORDER CARD */
.hcard{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);margin-bottom:10px;overflow:hidden;
  box-shadow:var(--sh);
  transition:box-shadow var(--t);
}
.hcard:hover{box-shadow:var(--sh2);}
.hcard-hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 14px;border-bottom:1px solid var(--border);gap:8px;
  cursor:pointer;
}
.hcard-hd:hover{background:var(--bg);}
.hcard-left{display:flex;align-items:center;gap:10px;}
.hcard-av{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--teal2),#b2dce8);
  display:grid;place-items:center;
  font-size:12px;font-weight:700;color:var(--teal);
}
[data-dark] .hcard-av{color:#fff;}
.hcard-name{font-size:13px;font-weight:700;}
.hcard-meta{font-size:10px;color:var(--hint);margin-top:1px;}
.hcard-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.badge{
  font-size:10px;font-weight:700;
  padding:2px 8px;border-radius:20px;white-space:nowrap;
}
.badge-g{background:var(--g-bg);color:var(--g-text);}
.badge-r{background:var(--r-bg);color:var(--r-text);}
.badge-b{background:var(--b-bg);color:var(--b-text);}
.hcard-chevron{color:var(--hint);font-size:12px;transition:transform var(--t);}
.hcard-chevron.open{transform:rotate(90deg);}

.hcard-body{display:none;border-top:1px solid var(--border);}
.hcard-body.open{display:block;}
.hcard-items{padding:8px 14px;}
.hitem{
  display:flex;align-items:center;gap:8px;
  padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;
}
.hitem:last-child{border-bottom:none;}
.hitem-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.hitem-name{flex:1;}
.hitem-qty{color:var(--sub);font-size:12px;white-space:nowrap;}
.hitem-confirmed{font-size:10px;color:var(--g-text);white-space:nowrap;}

.hcard-footer{
  padding:8px 14px;background:var(--bg);
  border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  font-size:11px;color:var(--hint);
}

/* EMPTY / LOADING */
.empty{text-align:center;padding:60px 20px;color:var(--hint);}
.empty-ic{font-size:40px;margin-bottom:10px;}
.empty-tx{font-size:14px;font-weight:500;}
.empty-sub{font-size:12px;margin-top:4px;}
.ld{display:flex;flex-direction:column;align-items:center;gap:12px;padding:60px 20px;color:var(--sub);font-size:13px;}
.spin{width:32px;height:32px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--teal);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.toast{
  position:fixed;bottom:80px;left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--text);color:var(--surface);
  padding:10px 18px;border-radius:24px;font-size:13px;font-weight:500;
  box-shadow:0 4px 18px rgba(0,0,0,.22);
  z-index:400;opacity:0;transition:opacity .2s,transform .2s;
  pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* BOTTOM NAV */
.bot-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--surface);border-top:1px solid var(--border);
  padding:0 8px env(safe-area-inset-bottom);
  z-index:150;box-shadow:0 -2px 10px rgba(0,0,0,.07);
}
.bot-nav-inner{display:flex;justify-content:space-around;}
.bnav-a{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 12px;font-size:10px;font-weight:500;color:var(--sub);
  text-decoration:none;
}
.bnav-a.on{color:var(--teal);}
.bnav-ic{font-size:20px;line-height:1;}

@media(min-width:621px){
  .bot-nav{display:none;}
  .results{padding-bottom:32px;}
}
@media(max-width:480px){
  .filter-row2{gap:6px;}
  .date-inp{max-width:130px;}
  .hdr-nav .nav-a span{display:none;}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="logo">BP</div>
  <div class="brand">
    <div class="brand-name">BeProud Clinic</div>
    <div class="brand-sub">ประวัติออเดอร์</div>
  </div>
  <nav class="hdr-nav">
    <a href="dashboard.html" class="nav-a">📋 <span>ออเดอร์</span></a>
    <a href="my-orders.html" class="nav-a">👤 <span>ของฉัน</span></a>
    <a href="history.html"   class="nav-a on">🗂 <span>ประวัติ</span></a>
  </nav>
  <button class="icn-btn" id="themeBtn">🌙</button>
</header>

<!-- FILTER -->
<div class="filter-panel">
  <div class="filter-row1">
    <div class="search-wrap">
      <span class="search-ic">🔍</span>
      <input type="text" id="searchQ" placeholder="ค้นหาชื่อ แผนก หรือสินค้า…">
    </div>
    <select class="flt-select" id="deptQ">
      <option value="">ทุกแผนก</option>
      <option>ธุรการ</option>
      <option>ผู้ช่วย</option>
      <option>แม่บ้าน</option>
      <option>Marketing</option>
      <option>อื่นๆ</option>
    </select>
  </div>
  <div class="filter-row2">
    <span class="date-label">📅 ตั้งแต่</span>
    <input type="date" class="date-inp" id="fromDate">
    <span class="filter-sep">—</span>
    <input type="date" class="date-inp" id="toDate">
    <button class="btn-search" onclick="doSearch()">ค้นหา</button>
    <button class="btn-clear" onclick="clearSearch()">ล้าง</button>
  </div>
</div>

<!-- STATS STRIP -->
<div class="stats-strip" id="statsStrip" style="display:none">
  <div class="stat-item">
    <span class="stat-dot" style="background:var(--teal)"></span>
    <div><div class="stat-num" id="stTotal">0</div><div class="stat-lbl">ออเดอร์ทั้งหมด</div></div>
  </div>
  <div class="stat-item">
    <span class="stat-dot" style="background:var(--g-dot)"></span>
    <div><div class="stat-num" id="stDone">0</div><div class="stat-lbl">เสร็จสิ้น</div></div>
  </div>
  <div class="stat-item">
    <span class="stat-dot" style="background:var(--r-dot)"></span>
    <div><div class="stat-num" id="stCancel">0</div><div class="stat-lbl">ยกเลิก</div></div>
  </div>
  <div class="stat-item" style="border-right:none">
    <span class="stat-dot" style="background:var(--gold)"></span>
    <div><div class="stat-num" id="stItems">0</div><div class="stat-lbl">รายการทั้งหมด</div></div>
  </div>
</div>

<!-- RESULTS -->
<div class="results" id="results">
  <div class="ld"><div class="spin"></div>กำลังโหลดประวัติ…</div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- BOTTOM NAV -->
<nav class="bot-nav">
  <div class="bot-nav-inner">
    <a href="dashboard.html" class="bnav-a"><span class="bnav-ic">📋</span>ออเดอร์</a>
    <a href="my-orders.html" class="bnav-a"><span class="bnav-ic">👤</span>ของฉัน</a>
    <a href="Stock_Check.html" class="bnav-a"><span class="bnav-ic">➕</span>สั่งของ</a>
    <a href="history.html"   class="bnav-a on"><span class="bnav-ic">🗂</span>ประวัติ</a>
  </div>
</nav>

<script>
const URL_ = 'https://script.google.com/macros/s/AKfycbwTvJBKmKC56TBodSnoweS-SoVtjLA0hBswziH6vpNSnWCAyMmHO1dgAVnvN84Yhod8/exec';
const DOTS = {'🟡 รอดำเนินการ':'#f59e0b','🔵 สั่งแล้ว รอของ':'#3b82f6','✅ ของมาแล้ว':'#22c55e','❌ ยกเลิก':'#ef4444'};

let dark = localStorage.getItem('bp-dk') === '1';
let allOrders = [];
let filtered  = [];
let page = 1;
const PER_PAGE = 15;

// theme
function applyTheme(){
  document.body.toggleAttribute('data-dark', dark);
  document.getElementById('themeBtn').textContent = dark ? '☀️' : '🌙';
  localStorage.setItem('bp-dk', dark ? '1' : '0');
}
applyTheme();
document.getElementById('themeBtn').onclick = () => { dark = !dark; applyTheme(); };

// ── Load ──────────────────────────────────────────────
async function loadHistory() {
  document.getElementById('results').innerHTML =
    '<div class="ld"><div class="spin"></div>กำลังโหลดประวัติ…</div>';
  try {
    const r = await fetch(`${URL_}?action=getHistory&page=1`);
    const j = await r.json();
    if (!j.success) throw new Error(j.data);
    allOrders = j.data.orders || [];
    filtered  = [...allOrders];
    updateStats();
    renderPage();
  } catch(e) {
    document.getElementById('results').innerHTML =
      `<div class="empty"><div class="empty-ic">⚠️</div><div class="empty-tx">โหลดไม่ได้</div><div class="empty-sub">${e.message}</div></div>`;
  }
}

// ── Search ────────────────────────────────────────────
function doSearch() {
  const q    = document.getElementById('searchQ').value.trim().toLowerCase();
  const dept = document.getElementById('deptQ').value;
  const from = document.getElementById('fromDate').value;
  const to   = document.getElementById('toDate').value;

  filtered = allOrders.filter(o => {
    // text search
    if (q) {
      const match =
        o.name.toLowerCase().includes(q) ||
        o.dept.toLowerCase().includes(q) ||
        o.items.some(i => i.product.toLowerCase().includes(q));
      if (!match) return false;
    }
    // dept filter
    if (dept && o.dept !== dept) return false;
    // date range
    if (from || to) {
      const d = parseDate(o.date);
      if (!d) return true;
      if (from && d < new Date(from)) return false;
      if (to   && d > new Date(to + 'T23:59:59')) return false;
    }
    return true;
  });

  page = 1;
  updateStats();
  renderPage();
}

function clearSearch() {
  document.getElementById('searchQ').value = '';
  document.getElementById('deptQ').value   = '';
  document.getElementById('fromDate').value = '';
  document.getElementById('toDate').value  = '';
  filtered = [...allOrders];
  page = 1;
  updateStats();
  renderPage();
}

// ── Stats ─────────────────────────────────────────────
function updateStats() {
  const strip = document.getElementById('statsStrip');
  if (!filtered.length) { strip.style.display = 'none'; return; }
  strip.style.display = 'flex';

  let done=0, cancel=0, items=0;
  filtered.forEach(o => {
    o.items.forEach(i => {
      items++;
      if (i.status === '✅ ของมาแล้ว') done++;
      if (i.status === '❌ ยกเลิก')    cancel++;
    });
  });
  document.getElementById('stTotal').textContent  = filtered.length;
  document.getElementById('stDone').textContent   = done;
  document.getElementById('stCancel').textContent = cancel;
  document.getElementById('stItems').textContent  = items;
}

// ── Render ────────────────────────────────────────────
function renderPage() {
  const wrap = document.getElementById('results');
  if (!filtered.length) {
    wrap.innerHTML = `
      <div class="empty">
        <div class="empty-ic">📭</div>
        <div class="empty-tx">ไม่พบประวัติออเดอร์</div>
        <div class="empty-sub">ลองปรับคำค้นหา หรือช่วงวันที่ใหม่นะคะ</div>
      </div>`;
    return;
  }

  const total = filtered.length;
  const totalPages = Math.ceil(total / PER_PAGE);
  const paged = filtered.slice((page-1)*PER_PAGE, page*PER_PAGE);

  wrap.innerHTML = `
    <div class="res-hd">
      <span class="res-title">พบ ${total} ออเดอร์</span>
      <span class="res-count">หน้า ${page} / ${totalPages}</span>
    </div>
    ${paged.map(o => hCard(o)).join('')}
    ${totalPages > 1 ? pagination(page, totalPages) : ''}`;

  // toggle accordion
  wrap.querySelectorAll('.hcard-hd').forEach(hd => {
    hd.addEventListener('click', () => {
      const body = hd.nextElementSibling;
      const chev = hd.querySelector('.hcard-chevron');
      body.classList.toggle('open');
      chev.classList.toggle('open');
    });
  });
}

function hCard(o) {
  // overall status
  const allDone    = o.items.every(i => i.status === '✅ ของมาแล้ว');
  const allCancel  = o.items.every(i => i.status === '❌ ยกเลิก');
  const mixed      = !allDone && !allCancel;
  let bc = 'badge-g', bt = '✅ เสร็จสิ้น';
  if (allCancel) { bc='badge-r'; bt='❌ ยกเลิก'; }
  if (mixed)     { bc='badge-b'; bt='🔵 บางส่วน'; }

  const itemsHtml = o.items.map(it => `
    <div class="hitem">
      <span class="hitem-dot" style="background:${DOTS[it.status]||'#ccc'}"></span>
      <span class="hitem-name">${it.product}</span>
      <span class="hitem-qty">${it.qty} ${it.unit}</span>
      ${it.confirmedBy ? `<span class="hitem-confirmed">✅ ${it.confirmedBy}</span>` : ''}
    </div>`).join('');

  const archived = o.archivedAt ? `เก็บ archive: ${fmtShort(o.archivedAt)}` : '';

  return `
    <div class="hcard">
      <div class="hcard-hd">
        <div class="hcard-left">
          <div class="hcard-av">${o.name.charAt(0)}</div>
          <div>
            <div class="hcard-name">${o.name}</div>
            <div class="hcard-meta">${o.dept} · ${fmt(o.date)} · #${o.orderId.slice(-8)}</div>
          </div>
        </div>
        <div class="hcard-right">
          <span class="badge ${bc}">${bt}</span>
          <span class="hcard-chevron">›</span>
        </div>
      </div>
      <div class="hcard-body">
        <div class="hcard-items">${itemsHtml}</div>
        <div class="hcard-footer">
          <span>${o.items.length} รายการ</span>
          <span>${archived}</span>
        </div>
      </div>
    </div>`;
}

function pagination(cur, total) {
  let btns = '';
  // prev
  btns += `<button class="pg-btn" onclick="goPage(${cur-1})" ${cur===1?'disabled':''}>‹ ก่อนหน้า</button>`;
  // page numbers
  const start = Math.max(1, cur-2);
  const end   = Math.min(total, cur+2);
  if (start > 1) btns += `<button class="pg-btn" onclick="goPage(1)">1</button>${start>2?'<span style="color:var(--hint);padding:0 4px">…</span>':''}`;
  for (let i=start; i<=end; i++) {
    btns += `<button class="pg-btn${i===cur?' on':''}" onclick="goPage(${i})">${i}</button>`;
  }
  if (end < total) btns += `${end<total-1?'<span style="color:var(--hint);padding:0 4px">…</span>':''}<button class="pg-btn" onclick="goPage(${total})">${total}</button>`;
  // next
  btns += `<button class="pg-btn" onclick="goPage(${cur+1})" ${cur===total?'disabled':''}>ถัดไป ›</button>`;
  return `<div class="pagination">${btns}</div>`;
}

function goPage(n) {
  page = n;
  renderPage();
  window.scrollTo({top:0, behavior:'smooth'});
}

// ── Helpers ───────────────────────────────────────────
function fmt(s) {
  if (!s) return '—';
  try {
    const d = parseDate(s);
    if (!d) return s;
    return d.toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'2-digit'});
  } catch { return s; }
}

function fmtShort(s) {
  if (!s) return '';
  return s.split(' ')[0];
}

function parseDate(s) {
  if (!s) return null;
  try {
    if (s.includes('GMT')) return new Date(s);
    // dd/MM/yyyy or dd/MM/yyyy HH:mm or "d/M/yyyy, HH:mm:ss"
    const clean = s.replace(/,/g, '').trim();
    const parts = clean.split(' ')[0].split('/');
    if (parts.length < 3) return null;
    let [d, m, y] = parts.map(Number);
    if (y > 2500) y -= 543;
    return new Date(y, m-1, d);
  } catch { return null; }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Enter to search
document.getElementById('searchQ').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

loadHistory();
